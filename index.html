<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPTP Chess Club · Tournament Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #262421;
      --charcoal: #312e2b;
      --charcoal-soft: #3f3b36;
      --board-light: #eeeed2;
      --board-dark: #769656;
      --board-dark-strong: #5d8740;
      --move-green: #81b64c;
      --cream: #f7f3df;
      --paper: #fffdf4;
      --gold: #c9a24a;
      --ember: #d64032;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(45deg, rgba(118, 150, 86, 0.10) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(118, 150, 86, 0.10) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(118, 150, 86, 0.10) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(118, 150, 86, 0.10) 75%),
        linear-gradient(180deg, #2f2c29 0%, #3a362f 34%, #ece4c7 34%, #f5f1df 100%);
      background-position: 0 0, 0 18px, 18px -18px, -18px 0, 0 0;
      background-size: 36px 36px, 36px 36px, 36px 36px, 36px 36px, auto;
      color: var(--ink);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 12% 4%, rgba(129, 182, 76, 0.22), transparent 24rem),
        radial-gradient(circle at 84% 10%, rgba(201, 162, 74, 0.16), transparent 22rem);
      pointer-events: none;
    }

    .glass {
      background: linear-gradient(135deg, rgba(255, 253, 244, 0.97), rgba(238, 238, 210, 0.91));
      border: 1px solid rgba(38, 36, 33, 0.14);
      box-shadow: 0 18px 45px rgba(15, 14, 12, 0.22);
      backdrop-filter: blur(12px);
    }

    .surface {
      background: rgba(255, 253, 244, 0.97);
      border: 1px solid rgba(38, 36, 33, 0.13);
      box-shadow: 0 12px 30px rgba(38, 36, 33, 0.12);
    }

    .tab-active {
      background: var(--move-green);
      color: #fff;
      border-color: var(--move-green);
      box-shadow: inset 0 -2px 0 rgba(38, 36, 33, 0.22), 0 8px 18px rgba(88, 132, 52, 0.28);
    }

    .tab-inactive {
      background: rgba(255, 253, 244, 0.92);
      color: #4b4842;
      border-color: rgba(38, 36, 33, 0.14);
    }

    .board-pattern {
      background-image:
        linear-gradient(45deg, rgba(118, 150, 86, 0.34) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(118, 150, 86, 0.34) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(118, 150, 86, 0.34) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(118, 150, 86, 0.34) 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }

    .scroll-shadow {
      background:
        linear-gradient(90deg, #fff 30%, rgba(255, 255, 255, 0)),
        linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 70%) 100% 0,
        linear-gradient(90deg, rgba(23, 32, 51, 0.10), rgba(23, 32, 51, 0)),
        linear-gradient(90deg, rgba(23, 32, 51, 0), rgba(23, 32, 51, 0.10)) 100% 0;
      background-attachment: local, local, scroll, scroll;
      background-repeat: no-repeat;
      background-size: 24px 100%, 24px 100%, 12px 100%, 12px 100%;
    }

    .admin-only[disabled],
    .admin-only[aria-disabled="true"] {
      opacity: 0.52;
      pointer-events: none;
    }

    header .bg-slate-950,
    aside.bg-slate-950 {
      background: linear-gradient(180deg, var(--charcoal) 0%, #24211f 100%);
    }

    button,
    input,
    select {
      border-radius: 0.65rem !important;
    }

    button.bg-slate-950,
    .bg-slate-950 {
      background-color: var(--charcoal) !important;
    }

    button.bg-emerald-700,
    .bg-emerald-700,
    .bg-emerald-600 {
      background-color: var(--move-green) !important;
    }

    .text-emerald-700 {
      color: var(--board-dark-strong) !important;
    }

    .bg-slate-50 {
      background-color: rgba(238, 238, 210, 0.56) !important;
    }

    .bg-white,
    .bg-white\/85 {
      background-color: var(--paper) !important;
    }

    .rounded-2xl {
      border-radius: 0.9rem !important;
    }

    .chess-board-frame {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(38, 36, 33, 0.88), rgba(49, 46, 43, 0.94)),
        repeating-linear-gradient(45deg, rgba(118, 150, 86, 0.18) 0 14px, rgba(238, 238, 210, 0.14) 14px 28px);
    }

    .canvas-wrap {
      overflow-x: auto;
      border-radius: 0.9rem;
      border: 1px solid rgba(38, 36, 33, 0.14);
      background: #262421;
      box-shadow: inset 0 0 0 8px rgba(255, 253, 244, 0.04);
    }

    #resultsCanvas {
      display: block;
      width: 100%;
      min-width: 820px;
      height: auto;
    }

    .metric-chip {
      background: rgba(38, 36, 33, 0.06);
      border: 1px solid rgba(38, 36, 33, 0.10);
    }

    @media (max-width: 560px) {
      .mobile-pad {
        padding-left: 0.85rem;
        padding-right: 0.85rem;
      }

      #resultsCanvas {
        min-width: 760px;
      }
    }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <header class="mx-auto max-w-7xl px-4 pb-4 pt-4 mobile-pad sm:pt-6">
      <div class="glass overflow-hidden rounded-2xl">
        <div class="grid gap-0 lg:grid-cols-[1fr_360px]">
          <section class="relative overflow-hidden p-5 sm:p-7">
            <div class="absolute inset-y-0 right-0 hidden w-80 board-pattern opacity-60 lg:block"></div>
            <div class="relative z-10 flex flex-col gap-5">
              <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex min-w-0 items-center gap-4">
                  <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-white shadow-sm">
                    <img class="h-12 w-12 rounded-xl object-contain" src="images.jpeg" alt="Logo UPTP">
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-bold uppercase tracking-[0.18em] text-green-800">UPTP Chess Club</p>
                    <h1 class="mt-1 text-2xl font-black tracking-normal text-slate-950 sm:text-4xl">Torneo Suizo 5+0</h1>
                    <p class="mt-1 text-sm font-bold text-slate-600">3 tableros físicos · izquierda blancas · derecha negras</p>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button id="adminButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 shadow-sm">Entrar admin</button>
                  <button id="printButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 shadow-sm">Imprimir</button>
                </div>
              </div>

              <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4" id="summary"></div>
            </div>
          </section>

          <aside class="border-t border-white/70 bg-slate-950 p-5 text-white lg:border-l lg:border-t-0">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-xs font-bold uppercase tracking-[0.18em] text-amber-300">Ronda activa</p>
                <p id="heroRound" class="mt-1 text-4xl font-black">-</p>
              </div>
              <div id="adminBadge" class="rounded-full bg-white/10 px-3 py-1 text-xs font-bold text-white">Bloqueado</div>
            </div>
            <div class="mt-5 overflow-hidden rounded-2xl border border-white/10 bg-white p-3">
              <img class="h-24 w-full object-contain" src="uptp.jpg" alt="Universidad Politécnica Taiwan Paraguay">
            </div>
            <div class="chess-board-frame mt-5 rounded-2xl border border-white/10 p-4">
              <p class="text-sm font-semibold text-slate-200">Siguiente tanda</p>
              <div id="nextBatchPreview" class="mt-3 space-y-2"></div>
            </div>
          </aside>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pb-10 mobile-pad">
      <nav class="flex flex-wrap gap-2" aria-label="Vistas">
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="dashboard">Panel</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="pairings">Partidas</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="map">Mapa</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="standings">Posiciones</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="history">Historial</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="players">Jugadores</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold admin-nav" data-view="database">Base local</button>
      </nav>

      <section id="alerts" class="mt-4 space-y-2"></section>

      <section id="view-dashboard" class="view mt-4"></section>
      <section id="view-pairings" class="view mt-4 hidden"></section>
      <section id="view-map" class="view mt-4 hidden"></section>
      <section id="view-standings" class="view mt-4 hidden"></section>
      <section id="view-history" class="view mt-4 hidden"></section>
      <section id="view-players" class="view mt-4 hidden"></section>
      <section id="view-database" class="view mt-4 hidden"></section>
    </main>
  </div>

  <div id="adminModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4">
    <div class="surface w-full max-w-md rounded-2xl p-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="text-xl font-black">Administrador</h2>
          <p id="adminModalHint" class="mt-1 text-sm text-slate-600"></p>
        </div>
        <button id="closeAdminModal" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-bold">Cerrar</button>
      </div>
      <form id="adminForm" class="mt-5 space-y-3">
        <input id="apiUrlInput" name="apiUrl" type="hidden">
        <label class="block text-sm">
          <span class="mb-1 block font-bold text-slate-700">Contraseña de administrador</span>
          <input id="adminKeyInput" name="key" type="password" autocomplete="current-password" placeholder="Escribí la contraseña" class="min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3">
        </label>
        <button id="adminSubmit" class="w-full rounded-xl bg-slate-950 px-4 py-3 text-sm font-black text-white">Entrar</button>
      </form>
      <button id="adminLockButton" class="mt-3 hidden w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-black text-slate-800">Bloquear administrador</button>
    </div>
  </div>

  <script>
    const DB_NAME = "uptp_chess_club_database";
    const DB_VERSION = 1;
    const STORE_NAME = "records";
    const LEGACY_STORAGE_KEY = "uptpSwissTournamentState.v1";
    const REMOTE_API_STORAGE_KEY = "uptpRemoteApiUrl";
    const LOGO_SOURCE = "Logos institucionales locales";

    const OFFICIAL_PLAYERS = [
      "Camila Rivas",
      "José Alejandro Costa Garrigoza",
      "Santiago Gamarra",
      "Bruno Tobias Gonzalez Mora",
      "David Nicolás Bareiro Pereira",
      "Fabrizio Matias Castro Gamarra",
      "Maximiliano Ferloni",
      "Nicolás Vargas",
      "Oscar Martín Barrios Brizuela",
      "Matias Canela",
      "Yanina Del Carmen Vera Benitez",
      "Sara Ltaif Fischer",
      "Diego Barrios",
      "Saúl Rojas",
      "Ian Gibbons",
      "Nico Segovia",
      "Josue Hartman"
    ];

    const OFFICIAL_DATA_PATCH_ID = "official-state-rounds-1-4-2026-06-01-v1";

    function officialMatch(id, round, batch, board, whiteId, blackId, result = "", source = "official") {
      return {
        id,
        round,
        batch,
        board,
        whiteId,
        blackId,
        result,
        createdAt: `2026-06-01T${String(round).padStart(2, "0")}:${String(batch).padStart(2, "0")}:${String(board).padStart(2, "0")}.000Z`,
        source
      };
    }

    function officialBye(id, round, batch, board, byeId) {
      return {
        id,
        round,
        batch,
        board,
        byeId,
        result: "bye",
        createdAt: `2026-06-01T${String(round).padStart(2, "0")}:${String(batch).padStart(2, "0")}:${String(board).padStart(2, "0")}.000Z`,
        source: "bye"
      };
    }

    const INITIAL_MATCHES = [
      officialMatch("m-r1-1-nicolas-saul", 1, 1, 1, "p8", "p14", "0-1", "initial"),
      officialMatch("m-r1-2-jose-yanina", 1, 1, 2, "p2", "p11", "1-0", "initial"),
      officialMatch("m-r1-3-santiago-nico", 1, 1, 3, "p3", "p16", "0-1", "initial"),
      officialMatch("m-r1-4-camila-ian", 1, 2, 1, "p1", "p15", "0.5-0.5"),
      officialMatch("m-r1-5-bruno-bareiro", 1, 2, 2, "p4", "p5", "1-0"),
      officialMatch("m-r1-6-oscar-diego", 1, 2, 3, "p9", "p13", "0-1"),
      officialMatch("m-r1-7-sara-fabrizio", 1, 3, 1, "p12", "p6", "0-1"),
      officialMatch("m-r1-8-matias-josue", 1, 3, 2, "p10", "p17", "0-1"),
      officialBye("bye-r1-maximiliano", 1, 3, 3, "p7"),

      officialMatch("m-r2-1-oscar-nicolas", 2, 1, 1, "p9", "p8", "1-0"),
      officialMatch("m-r2-2-camila-saul", 2, 1, 2, "p1", "p14", "0-1"),
      officialMatch("m-r2-3-fabrizio-jose", 2, 1, 3, "p6", "p2", "0-1"),
      officialMatch("m-r2-4-nico-bruno", 2, 2, 1, "p16", "p4", "1-0"),
      officialMatch("m-r2-5-diego-ian", 2, 2, 2, "p13", "p15", "0-1"),
      officialMatch("m-r2-6-santiago-josue", 2, 2, 3, "p3", "p17", "0-1"),
      officialMatch("m-r2-7-sara-matias", 2, 3, 1, "p12", "p10", "0-1"),
      officialMatch("m-r2-8-maximiliano-yanina", 2, 3, 2, "p7", "p11", "0-1"),
      officialBye("bye-r2-bareiro", 2, 3, 3, "p5"),

      officialMatch("m-r3-1-nicolas-santiago", 3, 1, 1, "p8", "p3"),
      officialMatch("m-r3-2-yanina-fabrizio", 3, 1, 2, "p11", "p6", "1-0"),
      officialMatch("m-r3-3-bareiro-oscar", 3, 1, 3, "p5", "p9", "0-1"),
      officialMatch("m-r3-4-bruno-camila", 3, 2, 1, "p4", "p1", "0-1"),
      officialMatch("m-r3-5-saul-nico", 3, 2, 2, "p14", "p16", "0-1"),
      officialMatch("m-r3-6-jose-maximiliano", 3, 2, 3, "p2", "p7", "1-0"),
      officialMatch("m-r3-7-diego-josue", 3, 3, 1, "p13", "p17"),
      officialMatch("m-r3-8-matias-ian", 3, 3, 2, "p10", "p15", "0-1"),
      officialBye("bye-r3-sara", 3, 3, 3, "p12"),

      officialMatch("m-r4-1-jose-nico", 4, 1, 1, "p2", "p16"),
      officialMatch("m-r4-2-ian-oscar", 4, 1, 2, "p15", "p9"),
      officialMatch("m-r4-3-saul-josue", 4, 1, 3, "p14", "p17"),
      officialMatch("m-r4-4-yanina-camila", 4, 2, 1, "p11", "p1"),
      officialMatch("m-r4-5-bruno-bareiro", 4, 2, 2, "p4", "p5"),
      officialMatch("m-r4-6-diego-fabrizio", 4, 2, 3, "p13", "p6"),
      officialMatch("m-r4-7-matias-maximiliano", 4, 3, 1, "p10", "p7"),
      officialMatch("m-r4-8-sara-nicolas", 4, 3, 2, "p12", "p8"),
      officialBye("bye-r4-santiago", 4, 3, 3, "p3")
    ];

    const DEFAULT_SETTINGS = {
      tournamentName: "Recreos UPTP 5+0",
      totalRounds: 5,
      boardsPerBatch: 3,
      autoPairing: true,
      adminHash: "",
      logoSource: LOGO_SOURCE
    };

    let database = null;
    let dbAvailable = false;
    let state = createInitialState();
    let settings = { ...DEFAULT_SETTINGS };
    let currentView = "dashboard";
    let remoteApiUrl = "";
    let remoteConnected = false;
    let remoteToken = sessionStorage.getItem("uptpRemoteToken") || "";
    let adminUnlocked = Boolean(remoteToken) || sessionStorage.getItem("uptpAdminUnlocked") === "true";
    let lastRemoteStateUpdatedAt = "";
    let autoSyncTimer = null;

    function createInitialState() {
      return {
        version: 2,
        players: OFFICIAL_PLAYERS.map((name, index) => ({
          id: `p${index + 1}`,
          name,
          seed: index + 1,
          active: true
        })),
        matches: clone(INITIAL_MATCHES),
        appliedPatches: [OFFICIAL_DATA_PATCH_ID],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeApiUrl(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    function sameOriginApiUrl() {
      const apiHosts = [
        "24.199.127.101",
        "24.199.127.101.sslip.io",
        "24.199.127.101.nip.io"
      ];

      return apiHosts.includes(window.location.hostname) ? window.location.origin : "";
    }

    async function apiRequest(path, options = {}) {
      if (!remoteApiUrl) throw new Error("remote_api_missing");

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (remoteToken) headers.Authorization = `Bearer ${remoteToken}`;

      const response = await fetch(`${remoteApiUrl}${path}`, {
        ...options,
        headers
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401) {
          remoteToken = "";
          adminUnlocked = false;
          sessionStorage.removeItem("uptpRemoteToken");
          sessionStorage.removeItem("uptpAdminUnlocked");
        }
        throw new Error(data.error || `api_${response.status}`);
      }

      return data;
    }

    async function loadRemoteData() {
      if (!remoteApiUrl) return false;

      try {
        const snapshot = await apiRequest("/api/state");
        state = normalizeState(snapshot.state || createInitialState());
        settings = { ...DEFAULT_SETTINGS, ...(snapshot.settings || {}) };
        lastRemoteStateUpdatedAt = state.updatedAt || "";
        remoteConnected = true;
        return true;
      } catch {
        remoteConnected = false;
        return false;
      }
    }

    async function saveRemoteSnapshot() {
      if (!remoteConnected || !adminUnlocked) return false;

      const snapshot = await apiRequest("/api/state", {
        method: "PUT",
        body: JSON.stringify({
          state,
          settings: publicSettings()
        })
      });

      state = normalizeState(snapshot.state || state);
      settings = { ...DEFAULT_SETTINGS, ...(snapshot.settings || settings) };
      lastRemoteStateUpdatedAt = state.updatedAt || "";
      return true;
    }

    async function syncRemoteData(options = {}) {
      if (!remoteApiUrl || !remoteConnected) return false;

      try {
        const snapshot = await apiRequest("/api/state");
        const incomingState = normalizeState(snapshot.state || state);
        const incomingSettings = { ...DEFAULT_SETTINGS, ...(snapshot.settings || settings) };
        const incomingUpdatedAt = incomingState.updatedAt || "";
        const changed = incomingUpdatedAt && incomingUpdatedAt !== lastRemoteStateUpdatedAt;

        remoteConnected = true;
        if (!changed) return false;

        state = incomingState;
        settings = incomingSettings;
        lastRemoteStateUpdatedAt = incomingUpdatedAt;
        render();
        if (options.notify) showToast("Datos actualizados desde la API.");
        return true;
      } catch {
        remoteConnected = false;
        if (options.notify) showToast("No se pudo sincronizar con la API.");
        render();
        return false;
      }
    }

    function startAutoSync() {
      window.clearInterval(autoSyncTimer);
      autoSyncTimer = window.setInterval(() => {
        if (!adminUnlocked) syncRemoteData();
      }, 12000);
    }

    function publicSettings() {
      const { adminHash, ...safeSettings } = settings;
      return safeSettings;
    }

    function openDatabase() {
      return new Promise(resolve => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "key" });
          }
        };
        request.onsuccess = event => resolve(event.target.result);
        request.onerror = () => resolve(null);
      });
    }

    function dbGet(key) {
      return new Promise(resolve => {
        if (!database) {
          const raw = localStorage.getItem(`fallback.${key}`);
          resolve(raw ? JSON.parse(raw) : null);
          return;
        }

        const tx = database.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(key);
        request.onsuccess = () => resolve(request.result ? request.result.value : null);
        request.onerror = () => resolve(null);
      });
    }

    function dbSet(key, value) {
      return new Promise(resolve => {
        if (!database) {
          localStorage.setItem(`fallback.${key}`, JSON.stringify(value));
          resolve();
          return;
        }

        const tx = database.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put({ key, value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function loadData() {
      database = await openDatabase();
      dbAvailable = Boolean(database);
      const originApiUrl = sameOriginApiUrl();
      const publicApiUrl = await loadPublicApiUrl();
      const savedApiUrl = normalizeApiUrl(localStorage.getItem(REMOTE_API_STORAGE_KEY));
      remoteApiUrl = originApiUrl || publicApiUrl || savedApiUrl;

      if (remoteApiUrl && savedApiUrl !== remoteApiUrl) {
        localStorage.setItem(REMOTE_API_STORAGE_KEY, remoteApiUrl);
      }

      if (await loadRemoteData()) {
        if (!remoteToken) {
          adminUnlocked = false;
          sessionStorage.removeItem("uptpAdminUnlocked");
        }
        return;
      }
      if (remoteApiUrl && remoteToken) {
        remoteToken = "";
        adminUnlocked = false;
        sessionStorage.removeItem("uptpRemoteToken");
        sessionStorage.removeItem("uptpAdminUnlocked");
      } else if (remoteApiUrl) {
        adminUnlocked = false;
        sessionStorage.removeItem("uptpAdminUnlocked");
      }

      const savedState = await dbGet("tournament");
      const savedSettings = await dbGet("settings");

      if (savedState) {
        state = normalizeState(savedState);
        if (applyOfficialDataPatches()) await saveState();
      } else {
        const legacy = readLegacyState();
        state = legacy ? normalizeState(legacy) : createInitialState();
        if (legacy && applyOfficialDataPatches()) await saveState();
        await saveState();
      }

      settings = { ...DEFAULT_SETTINGS, ...(savedSettings || {}) };
      await saveSettings();
    }

    async function loadPublicApiUrl() {
      try {
        const response = await fetch("api-config.json", { cache: "no-store" });
        if (!response.ok) return "";
        const config = await response.json();
        return normalizeApiUrl(config.apiUrl);
      } catch {
        return "";
      }
    }

    function readLegacyState() {
      try {
        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function normalizeState(input) {
      const normalized = {
        ...createInitialState(),
        ...input,
        players: Array.isArray(input.players) ? input.players : [],
        matches: Array.isArray(input.matches) ? input.matches : [],
        appliedPatches: Array.isArray(input.appliedPatches) ? input.appliedPatches : []
      };

      normalized.players = normalized.players.map((player, index) => ({
        id: player.id || `p-${Date.now()}-${index}`,
        name: player.name || "Jugador sin nombre",
        seed: Number.isFinite(Number(player.seed)) ? Number(player.seed) : index + 1,
        active: player.active !== false
      }));

      normalized.matches = normalized.matches.map((match, index) => ({
        id: match.id || `m-${Date.now()}-${index}`,
        round: positiveNumber(match.round, 1),
        batch: positiveNumber(match.batch, 1),
        board: positiveNumber(match.board, 1),
        whiteId: match.whiteId,
        blackId: match.blackId,
        byeId: match.byeId,
        result: match.result || "",
        createdAt: match.createdAt || new Date().toISOString(),
        source: match.source || "manual"
      })).filter(match => (match.whiteId && match.blackId) || match.byeId);

      return normalized;
    }

    function applyOfficialDataPatches() {
      let changed = false;

      if (!state.appliedPatches.includes(OFFICIAL_DATA_PATCH_ID)) {
        ensureOfficialPlayer({ id: "p17", name: "Josue Hartman", seed: 17, active: true });
        const replaceableSources = new Set(["initial", "official", "bye", "auto", "advance", "admin"]);
        state.matches = state.matches.filter(match => !replaceableSources.has(match.source));
        for (const officialMatch of INITIAL_MATCHES) {
          upsertOfficialMatch(officialMatch);
        }
        state.appliedPatches.push(OFFICIAL_DATA_PATCH_ID);
        changed = true;
      }

      return changed;
    }

    function ensureOfficialPlayer(player) {
      const exists = state.players.some(item => item.id === player.id || item.name.toLowerCase() === player.name.toLowerCase());
      if (!exists) state.players.push(clone(player));
    }

    function upsertOfficialMatch(officialMatch) {
      const existing = state.matches.find(match =>
        match.id === officialMatch.id ||
        (officialMatch.byeId && match.byeId === officialMatch.byeId && match.round === officialMatch.round) ||
        ((match.whiteId === officialMatch.whiteId && match.blackId === officialMatch.blackId) ||
          (match.whiteId === officialMatch.blackId && match.blackId === officialMatch.whiteId))
      );

      if (existing) {
        Object.assign(existing, clone(officialMatch));
      } else {
        state.matches.push(clone(officialMatch));
      }
    }

    async function saveState() {
      state.updatedAt = new Date().toISOString();
      if (remoteConnected) {
        try {
          await saveRemoteSnapshot();
          return true;
        } catch {
          remoteConnected = false;
          remoteToken = "";
          adminUnlocked = false;
          sessionStorage.removeItem("uptpRemoteToken");
          sessionStorage.removeItem("uptpAdminUnlocked");
          showToast("No se pudo guardar en la API. Volvé a entrar como admin.");
          throw new Error("remote_save_failed");
        }
      }
      await dbSet("tournament", state);
      return true;
    }

    async function saveSettings() {
      if (remoteConnected) {
        try {
          await saveRemoteSnapshot();
          return true;
        } catch {
          remoteConnected = false;
          remoteToken = "";
          adminUnlocked = false;
          sessionStorage.removeItem("uptpRemoteToken");
          sessionStorage.removeItem("uptpAdminUnlocked");
          showToast("No se pudo guardar la configuración en la API.");
          throw new Error("remote_save_failed");
        }
      }
      await dbSet("settings", settings);
      return true;
    }

    async function hashText(text) {
      const value = String(text);
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join("");
      }

      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = ((hash << 5) - hash + value.charCodeAt(index)) | 0;
      }
      return `fallback-${hash}`;
    }

    function getPlayer(id) {
      return state.players.find(player => player.id === id);
    }

    function playerName(id) {
      return getPlayer(id)?.name || "Jugador eliminado";
    }

    function activePlayers() {
      return state.players.filter(player => player.active);
    }

    function sortedMatches(matches = state.matches) {
      return [...matches].sort((a, b) =>
        a.round - b.round ||
        a.batch - b.batch ||
        a.board - b.board ||
        String(a.createdAt).localeCompare(String(b.createdAt))
      );
    }

    function completedMatches() {
      return sortedMatches(state.matches.filter(match => match.result));
    }

    function pendingMatches() {
      return sortedMatches(state.matches.filter(match => !match.result));
    }

    function matchesForRound(round) {
      return sortedMatches(state.matches.filter(match => match.round === round));
    }

    function maxRound() {
      return state.matches.reduce((max, match) => Math.max(max, match.round || 1), 1);
    }

    function scoreFromResult(match, playerId) {
      if (match.result === "bye") return match.byeId === playerId ? 1 : 0;
      if (!match.result) return 0;
      if (match.result === "1-0") return match.whiteId === playerId ? 1 : 0;
      if (match.result === "0-1") return match.blackId === playerId ? 1 : 0;
      if (match.result === "0.5-0.5") return 0.5;
      return 0;
    }

    function calculateStats() {
      const stats = new Map();
      state.players.forEach(player => {
        stats.set(player.id, {
          player,
          points: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          played: 0,
          scheduled: 0,
          whiteCount: 0,
          blackCount: 0,
          colorHistory: [],
          completedOpponentIds: [],
          allOpponentIds: new Set(),
          buchholz: 0
        });
      });

      for (const match of sortedMatches()) {
        if (match.byeId) {
          const bye = stats.get(match.byeId);
          if (!bye) continue;
          bye.scheduled += 1;
          if (match.result === "bye") {
            bye.points += 1;
            bye.wins += 1;
            bye.played += 1;
          }
          continue;
        }

        const white = stats.get(match.whiteId);
        const black = stats.get(match.blackId);
        if (!white || !black) continue;

        white.scheduled += 1;
        black.scheduled += 1;
        white.whiteCount += 1;
        black.blackCount += 1;
        white.colorHistory.push("B");
        black.colorHistory.push("N");
        white.allOpponentIds.add(match.blackId);
        black.allOpponentIds.add(match.whiteId);

        if (!match.result) continue;

        const whiteScore = scoreFromResult(match, match.whiteId);
        const blackScore = scoreFromResult(match, match.blackId);
        white.points += whiteScore;
        black.points += blackScore;
        white.played += 1;
        black.played += 1;
        white.completedOpponentIds.push(match.blackId);
        black.completedOpponentIds.push(match.whiteId);

        if (whiteScore === 1) {
          white.wins += 1;
          black.losses += 1;
        } else if (blackScore === 1) {
          black.wins += 1;
          white.losses += 1;
        } else {
          white.draws += 1;
          black.draws += 1;
        }
      }

      for (const item of stats.values()) {
        item.buchholz = item.completedOpponentIds.reduce((sum, opponentId) => {
          return sum + (stats.get(opponentId)?.points || 0);
        }, 0);
      }

      return stats;
    }

    function standings() {
      return [...calculateStats().values()].sort((a, b) =>
        b.points - a.points ||
        b.wins - a.wins ||
        b.buchholz - a.buchholz ||
        a.player.seed - b.player.seed ||
        a.player.name.localeCompare(b.player.name, "es")
      );
    }

    function hasPlayedOrScheduled(idA, idB) {
      return state.matches.some(match =>
        !match.byeId &&
        ((match.whiteId === idA && match.blackId === idB) ||
          (match.whiteId === idB && match.blackId === idA))
      );
    }

    function lastColors(stat, count) {
      return stat.colorHistory.slice(-count);
    }

    function colorPenalty(stat, color) {
      const whiteAfter = stat.whiteCount + (color === "B" ? 1 : 0);
      const blackAfter = stat.blackCount + (color === "N" ? 1 : 0);
      const balance = Math.abs(whiteAfter - blackAfter);
      const last = lastColors(stat, 1)[0];
      const lastTwo = lastColors(stat, 2);
      let streak = 0;

      if (last === color) streak += 6;
      if (lastTwo.length === 2 && lastTwo.every(item => item === color)) streak += 30;

      return balance + streak;
    }

    function orientedPair(idA, idB, stats) {
      const a = stats.get(idA);
      const b = stats.get(idB);
      const aWhite = colorPenalty(a, "B") + colorPenalty(b, "N");
      const bWhite = colorPenalty(a, "N") + colorPenalty(b, "B");

      if (aWhite < bWhite) return { whiteId: idA, blackId: idB, colorCost: aWhite };
      if (bWhite < aWhite) return { whiteId: idB, blackId: idA, colorCost: bWhite };

      return a.player.seed <= b.player.seed
        ? { whiteId: idA, blackId: idB, colorCost: aWhite }
        : { whiteId: idB, blackId: idA, colorCost: bWhite };
    }

    function pairingCost(idA, idB, stats, orderedIds) {
      const a = stats.get(idA);
      const b = stats.get(idB);
      const repeated = hasPlayedOrScheduled(idA, idB) ? 1_000_000_000 : 0;
      const scoreDistance = Math.abs(a.points - b.points) * 1_000_000;
      const indexDistance = Math.abs(orderedIds.indexOf(idA) - orderedIds.indexOf(idB));
      const standardSwissDistance = Math.abs(indexDistance - Math.floor(orderedIds.length / 2)) * 1_000;
      const color = orientedPair(idA, idB, stats).colorCost * 100;
      const seed = Math.abs(a.player.seed - b.player.seed);

      return repeated + scoreDistance + standardSwissDistance + color + seed;
    }

    function generateSwissPairs(playerIds) {
      const stats = calculateStats();
      const ordered = [...playerIds].sort((idA, idB) => {
        const a = stats.get(idA);
        const b = stats.get(idB);
        return b.points - a.points ||
          a.player.seed - b.player.seed ||
          a.player.name.localeCompare(b.player.name, "es");
      });
      const memo = new Map();

      function solve(remaining) {
        const key = remaining.join("|");
        if (memo.has(key)) return memo.get(key);
        if (remaining.length === 0) return { cost: 0, pairs: [] };

        const first = remaining[0];
        let best = { cost: Number.POSITIVE_INFINITY, pairs: [] };
        const candidates = remaining.slice(1).sort((idA, idB) =>
          pairingCost(first, idA, stats, ordered) - pairingCost(first, idB, stats, ordered)
        );

        for (const candidate of candidates) {
          const rest = remaining.filter(id => id !== first && id !== candidate);
          const solved = solve(rest);
          const cost = pairingCost(first, candidate, stats, ordered) + solved.cost;
          if (cost < best.cost) {
            best = {
              cost,
              pairs: [orientedPair(first, candidate, stats), ...solved.pairs]
            };
          }
        }

        memo.set(key, best);
        return best;
      }

      return solve(ordered).pairs;
    }

    function chooseByeId(playerIds) {
      const stats = calculateStats();
      const previousByes = new Set(state.matches.filter(match => match.byeId).map(match => match.byeId));
      const candidates = playerIds.filter(id => !previousByes.has(id));
      const pool = candidates.length ? candidates : playerIds;

      return [...pool].sort((idA, idB) => {
        const a = stats.get(idA);
        const b = stats.get(idB);
        return a.points - b.points ||
          a.played - b.played ||
          b.player.seed - a.player.seed ||
          a.player.name.localeCompare(b.player.name, "es");
      })[0];
    }

    function generationContext() {
      const activeIds = activePlayers().map(player => player.id);
      if (activeIds.length < 2) return null;

      const round = maxRound();
      const expected = Math.ceil(activeIds.length / 2);
      const roundMatches = matchesForRound(round);
      const isCurrentIncomplete = roundMatches.length > 0 && roundMatches.length < expected;

      if (isCurrentIncomplete) {
        const scheduledIds = new Set();
        roundMatches.forEach(match => {
          if (match.byeId) scheduledIds.add(match.byeId);
          scheduledIds.add(match.whiteId);
          scheduledIds.add(match.blackId);
        });

        return {
          mode: "complete",
          round,
          existingMatches: roundMatches.length,
          playerIds: activeIds.filter(id => !scheduledIds.has(id))
        };
      }

      if (roundMatches.length >= expected && round >= settings.totalRounds) return null;

      return {
        mode: "new",
        round: state.matches.length ? round + 1 : 1,
        existingMatches: 0,
        playerIds: activeIds
      };
    }

    function advanceGenerationContext() {
      const busyIds = new Set();
      pendingMatches().forEach(match => {
        if (match.byeId) busyIds.add(match.byeId);
        busyIds.add(match.whiteId);
        busyIds.add(match.blackId);
      });

      const round = maxRound() + 1;
      const alreadyAdvancedIds = new Set();
      matchesForRound(round).forEach(match => {
        if (match.byeId) alreadyAdvancedIds.add(match.byeId);
        alreadyAdvancedIds.add(match.whiteId);
        alreadyAdvancedIds.add(match.blackId);
      });

      const playerIds = activePlayers()
        .map(player => player.id)
        .filter(id => !busyIds.has(id) && !alreadyAdvancedIds.has(id));

      return {
        mode: "advance",
        round,
        existingMatches: matchesForRound(round).length,
        playerIds: playerIds.length % 2 === 0 ? playerIds : playerIds.slice(0, -1)
      };
    }

    async function generatePairings(options = {}) {
      if (!options.advance && pendingMatches().length > 0) {
        if (!options.silent) showToast("Primero cargá los resultados pendientes.");
        return false;
      }

      const context = options.advance ? advanceGenerationContext() : generationContext();
      if (!context) {
        if (!options.silent) showToast("No hay una ronda disponible para generar.");
        return false;
      }

      if (context.playerIds.length < 2) {
        if (!options.silent) showToast("No hay suficientes jugadores libres para adelantar partidas.");
        return false;
      }

      const playerIds = [...context.playerIds];
      let byeMatch = null;

      if (playerIds.length % 2 !== 0) {
        const byeId = chooseByeId(playerIds);
        const byeIndex = context.existingMatches + Math.floor(playerIds.length / 2);
        byeMatch = {
          id: `bye-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          round: context.round,
          batch: Math.floor(byeIndex / settings.boardsPerBatch) + 1,
          board: (byeIndex % settings.boardsPerBatch) + 1,
          byeId,
          result: "bye",
          createdAt: new Date().toISOString(),
          source: "bye"
        };
        playerIds.splice(playerIds.indexOf(byeId), 1);
      }

      const pairs = generateSwissPairs(playerIds);
      const createdAt = new Date().toISOString();
      const newMatches = pairs.map((pair, index) => {
        const matchIndex = context.existingMatches + index;
        return {
          id: `m-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
          round: context.round,
          batch: Math.floor(matchIndex / settings.boardsPerBatch) + 1,
          board: (matchIndex % settings.boardsPerBatch) + 1,
          whiteId: pair.whiteId,
          blackId: pair.blackId,
          result: "",
          createdAt,
          source: options.advance ? "advance" : (options.auto ? "auto" : "admin")
        };
      });

      if (byeMatch) newMatches.push(byeMatch);

      state.matches.push(...newMatches);
      await saveState();
      currentView = "pairings";
      render();
      if (!options.silent) {
        if (context.mode === "advance") {
          showToast(`Se generó un adelanto de ronda ${context.round}: ${newMatches.length} partidas con jugadores libres.`);
        } else {
          const verb = context.mode === "complete" ? "completó" : "generó";
          showToast(`Se ${verb} la ronda ${context.round}: ${newMatches.length} partidas.`);
        }
      }
      return true;
    }

    async function maybeAutoGeneratePairings() {
      if (!settings.autoPairing) return;
      if (pendingMatches().length > 0) return;
      const context = generationContext();
      if (!context || context.playerIds.length === 0) return;
      await generatePairings({ auto: true, silent: true });
    }

    async function setMatchResult(matchId, result) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      match.result = result;
      await saveState();
      await maybeAutoGeneratePairings();
      render();
      showToast(remoteConnected ? "Resultado guardado en la API." : "Resultado guardado solo en este navegador.");
    }

    async function updateMatch(matchId, updates) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      Object.assign(match, updates);
      await saveState();
      render();
      showToast(remoteConnected ? "Partida actualizada en la API." : "Partida actualizada solo en este navegador.");
    }

    async function deleteMatch(matchId) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      const confirmed = confirm(`¿Eliminar ${playerName(match.whiteId)} vs ${playerName(match.blackId)}?`);
      if (!confirmed) return;
      state.matches = state.matches.filter(item => item.id !== matchId);
      await saveState();
      render();
      showToast(remoteConnected ? "Partida eliminada en la API." : "Partida eliminada solo en este navegador.");
    }

    async function updatePlayer(playerId, updates) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const player = getPlayer(playerId);
      if (!player) return;
      Object.assign(player, updates);
      await saveState();
      render();
    }

    async function addPlayer(form) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const formData = new FormData(form);
      const name = String(formData.get("name") || "").trim();
      if (!name) return showToast("Ingresá un nombre.");
      const nextSeed = Math.max(0, ...state.players.map(player => Number(player.seed) || 0)) + 1;
      state.players.push({
        id: `p-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        name,
        seed: nextSeed,
        active: true
      });
      await saveState();
      form.reset();
      render();
      showToast(remoteConnected ? "Jugador agregado en la API." : "Jugador agregado solo en este navegador.");
    }

    async function addManualMatch(form) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const formData = new FormData(form);
      const whiteId = formData.get("whiteId");
      const blackId = formData.get("blackId");
      if (!whiteId || !blackId || whiteId === blackId) return showToast("Elegí dos jugadores distintos.");

      state.matches.push({
        id: `m-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        round: positiveNumber(formData.get("round"), maxRound()),
        batch: positiveNumber(formData.get("batch"), 1),
        board: positiveNumber(formData.get("board"), 1),
        whiteId,
        blackId,
        result: formData.get("result") || "",
        createdAt: new Date().toISOString(),
        source: "manual"
      });
      await saveState();
      form.reset();
      render();
      showToast(remoteConnected ? "Partida cargada en la API." : "Partida cargada solo en este navegador.");
    }

    function groupedByBatch(matches) {
      const groups = new Map();
      matches.forEach(match => {
        const key = `Ronda ${match.round} · Tanda ${match.batch}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(match);
      });
      return [...groups.entries()];
    }

    function resultText(match) {
      if (match.result === "bye") return `Mesa libre: ${playerName(match.byeId)} (+1)`;
      if (match.result === "1-0") return `Ganó ${playerName(match.whiteId)}`;
      if (match.result === "0-1") return `Ganó ${playerName(match.blackId)}`;
      if (match.result === "0.5-0.5") return "Tablas";
      return "Pendiente";
    }

    function formatPoints(value) {
      return Number.isInteger(value) ? String(value) : Number(value).toFixed(1);
    }

    function colorBadges(colors) {
      if (!colors.length) return `<span class="text-slate-400">-</span>`;
      return colors.map(color => {
        const title = color === "B" ? "Blancas" : "Negras";
        const classes = color === "B"
          ? "border-slate-300 bg-white text-slate-950"
          : "border-slate-950 bg-slate-950 text-white";
        return `<span title="${title}" class="inline-flex h-6 min-w-6 items-center justify-center rounded-md border px-1.5 text-xs font-black ${classes}">${color}</span>`;
      }).join(" ");
    }

    function renderSummary() {
      const stats = calculateStats();
      const table = standings();
      const pending = pendingMatches();
      const completed = completedMatches();
      const leader = table[0];
      const context = generationContext();
      const cards = [
        { label: "Jugadores", value: activePlayers().length, detail: `${state.players.length} registrados` },
        { label: "Pendientes", value: pending.length, detail: pending.length ? `Ronda ${pending[0].round}` : "Sin partidas abiertas" },
        { label: "Terminadas", value: completed.length, detail: `${settings.totalRounds} rondas configuradas` },
        { label: "Líder", value: leader ? formatPoints(leader.points) : "0", detail: leader ? leader.player.name : "Sin líder" }
      ];

      document.querySelector("#summary").innerHTML = cards.map(card => `
        <article class="rounded-2xl border border-white/70 bg-white/85 p-4 shadow-sm">
          <p class="text-xs font-black uppercase tracking-[0.16em] text-slate-500">${card.label}</p>
          <p class="mt-1 text-3xl font-black text-slate-950">${escapeHtml(card.value)}</p>
          <p class="mt-1 truncate text-sm font-semibold text-slate-600">${escapeHtml(card.detail)}</p>
        </article>
      `).join("");

      document.querySelector("#heroRound").textContent = String(maxRound());
      document.querySelector("#adminBadge").textContent = adminUnlocked
        ? (remoteConnected ? "Admin API" : "Admin local")
        : (remoteConnected ? "API conectada" : "Bloqueado");
      document.querySelector("#adminBadge").className = adminUnlocked
        ? "rounded-full bg-emerald-400 px-3 py-1 text-xs font-black text-emerald-950"
        : "rounded-full bg-white/10 px-3 py-1 text-xs font-black text-white";

      const next = pending.slice(0, settings.boardsPerBatch);
      document.querySelector("#nextBatchPreview").innerHTML = next.length
        ? next.map(match => `

    function drawResultsCanvas() {
      const canvas = document.querySelector("#resultsCanvas");
      if (!canvas) return;

      const wrapper = canvas.parentElement;
      const matches = sortedMatches();
      const width = Math.max(820, Math.floor(wrapper?.clientWidth || 820));
      const rowHeight = 86;
      const headerHeight = 132;
      const height = Math.max(360, headerHeight + Math.max(matches.length, 1) * rowHeight + 40);
      const dpr = window.devicePixelRatio || 1;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.height = `${height}px`;

      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      drawCanvasBackground(ctx, width, height);

      ctx.fillStyle = "#fffdf4";
      ctx.font = "900 26px Inter, system-ui, sans-serif";
      ctx.fillText("UPTP Chess Club", 34, 48);
      ctx.font = "700 13px Inter, system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,253,244,0.72)";
      ctx.fillText(`${settings.tournamentName} · Mapa de resultados`, 36, 72);

      drawLegend(ctx, width - 330, 32);

      if (!matches.length) {
        ctx.fillStyle = "rgba(255,253,244,0.78)";
        ctx.font = "800 18px Inter, system-ui, sans-serif";
        ctx.fillText("Todavía no hay partidas registradas.", 36, headerHeight + 32);
        return;
      }

      matches.forEach((match, index) => {
        drawCanvasMatchRow(ctx, match, index, 28, headerHeight + index * rowHeight, width - 56, rowHeight - 12);
      });
    }

    function drawCanvasBackground(ctx, width, height) {
      ctx.fillStyle = "#262421";
      ctx.fillRect(0, 0, width, height);

      const square = 40;
      for (let y = 0; y < height; y += square) {
        for (let x = 0; x < width; x += square) {
          ctx.fillStyle = ((x / square + y / square) % 2 === 0)
            ? "rgba(238,238,210,0.06)"
            : "rgba(118,150,86,0.18)";
          ctx.fillRect(x, y, square, square);
        }
      }

      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "rgba(129,182,76,0.20)");
      gradient.addColorStop(0.5, "rgba(38,36,33,0.52)");
      gradient.addColorStop(1, "rgba(201,162,74,0.16)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawLegend(ctx, x, y) {
      const items = [
        ["#81b64c", "Terminada"],
        ["#c9a24a", "Tablas / libre"],
        ["#8a8580", "Pendiente"]
      ];

      items.forEach((item, index) => {
        const itemX = x + index * 108;
        ctx.fillStyle = item[0];
        roundRect(ctx, itemX, y, 14, 14, 4);
        ctx.fill();
        ctx.fillStyle = "rgba(255,253,244,0.78)";
        ctx.font = "800 11px Inter, system-ui, sans-serif";
        ctx.fillText(item[1], itemX + 20, y + 12);
      });
    }

    function drawCanvasMatchRow(ctx, match, index, x, y, width, height) {
      const isPending = !match.result;
      const isDrawLike = match.result === "0.5-0.5" || match.result === "bye";
      const accent = isPending ? "#8a8580" : (isDrawLike ? "#c9a24a" : "#81b64c");
      const darkSquare = index % 2 === 0 ? "#769656" : "#5d8740";
      const lightSquare = index % 2 === 0 ? "#eeeed2" : "#f7f3df";

      ctx.fillStyle = index % 2 === 0 ? "rgba(255,253,244,0.96)" : "rgba(238,238,210,0.94)";
      roundRect(ctx, x, y, width, height, 16);
      ctx.fill();

      ctx.fillStyle = darkSquare;
      roundRect(ctx, x, y, 84, height, 16);
      ctx.fill();

      ctx.fillStyle = "rgba(38,36,33,0.16)";
      ctx.fillRect(x + 70, y, 14, height);

      ctx.fillStyle = "#fffdf4";
      ctx.font = "900 18px Inter, system-ui, sans-serif";
      ctx.fillText(`R${match.round}`, x + 18, y + 31);
      ctx.font = "800 11px Inter, system-ui, sans-serif";
      ctx.fillText(match.result === "bye" ? "LIBRE" : `T${match.batch} M${match.board}`, x + 18, y + 54);

      if (match.byeId) {
        drawByeRow(ctx, match, x + 104, y + 14, width - 128, height - 28, accent);
        return;
      }

      const whiteWon = match.result === "1-0";
      const blackWon = match.result === "0-1";
      const leftX = x + 104;
      const pillWidth = 90;
      const gap = 18;
      const rightMargin = 18;
      const playerWidth = Math.max(190, (width - 104 - rightMargin - pillWidth - gap * 2) / 2);
      const pillX = leftX + playerWidth + gap;
      const rightX = pillX + pillWidth + gap;

      drawCanvasPlayer(ctx, "Blancas", playerName(match.whiteId), leftX, y + 13, playerWidth, height - 26, lightSquare, "#262421", whiteWon);
      drawResultPill(ctx, resultLabel(match), pillX, y + 22, pillWidth, 34, accent, isPending);
      drawCanvasPlayer(ctx, "Negras", playerName(match.blackId), rightX, y + 13, playerWidth, height - 26, "#312e2b", "#fffdf4", blackWon);
    }

    function drawCanvasPlayer(ctx, label, name, x, y, width, height, fill, color, winner) {
      ctx.fillStyle = fill;
      roundRect(ctx, x, y, width, height, 12);
      ctx.fill();

      ctx.strokeStyle = winner ? "#81b64c" : "rgba(38,36,33,0.14)";
      ctx.lineWidth = winner ? 3 : 1;
      roundRect(ctx, x + 0.5, y + 0.5, width - 1, height - 1, 12);
      ctx.stroke();

      ctx.fillStyle = color === "#fffdf4" ? "rgba(255,253,244,0.66)" : "rgba(38,36,33,0.56)";
      ctx.font = "900 10px Inter, system-ui, sans-serif";
      ctx.fillText(label.toUpperCase(), x + 14, y + 18);

      ctx.fillStyle = color;
      ctx.font = "900 15px Inter, system-ui, sans-serif";
      drawWrappedCanvasText(ctx, name, x + 14, y + 40, width - 28, 17, 2);

      if (winner) {
        ctx.fillStyle = "#81b64c";
        ctx.font = "900 12px Inter, system-ui, sans-serif";
        ctx.fillText("+1", x + width - 35, y + 20);
      }
    }

    function drawByeRow(ctx, match, x, y, width, height, accent) {
      ctx.fillStyle = "#fff8df";
      roundRect(ctx, x, y, width, height, 12);
      ctx.fill();

      ctx.strokeStyle = "rgba(201,162,74,0.42)";
      ctx.lineWidth = 2;
      roundRect(ctx, x + 1, y + 1, width - 2, height - 2, 12);
      ctx.stroke();

      ctx.fillStyle = "#4d4526";
      ctx.font = "900 13px Inter, system-ui, sans-serif";
      ctx.fillText("MESA LIBRE", x + 18, y + 24);
      ctx.font = "900 20px Inter, system-ui, sans-serif";
      ctx.fillText(playerName(match.byeId), x + 18, y + 52);

      drawResultPill(ctx, "+1", x + width - 76, y + 18, 52, 34, accent, false);
    }

    function drawResultPill(ctx, label, x, y, width, height, fill, pending) {
      ctx.fillStyle = pending ? "#8a8580" : fill;
      roundRect(ctx, x, y, width, height, 18);
      ctx.fill();
      ctx.fillStyle = "#fffdf4";
      ctx.font = "900 14px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x + width / 2, y + 22);
      ctx.textAlign = "left";
    }

    function resultLabel(match) {
      if (match.result === "0.5-0.5") return "1/2";
      if (match.result === "bye") return "+1";
      return match.result || "-";
    }

    function drawWrappedCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const words = String(text).split(/\s+/);
      const lines = [];
      let line = "";

      words.forEach(word => {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth || !line) {
          line = test;
        } else {
          lines.push(line);
          line = word;
        }
      });
      if (line) lines.push(line);

      lines.slice(0, maxLines).forEach((item, index) => {
        const suffix = index === maxLines - 1 && lines.length > maxLines ? "..." : "";
        ctx.fillText(`${item}${suffix}`, x, y + index * lineHeight);
      });
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

                  <th class="px-3 py-3">Rivales</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${rows.map((row, index) => `
                  <tr class="${row.player.active ? "" : "bg-slate-50 text-slate-400"}">
                    <td class="px-3 py-3 font-black">${index + 1}</td>
                    <td class="px-3 py-3">
                      <div class="font-black">${escapeHtml(row.player.name)}</div>
                      <div class="text-xs font-bold text-slate-400">Seed ${row.player.seed}${row.player.active ? "" : " · inactivo"}</div>
                    </td>
                    <td class="px-3 py-3 text-lg font-black text-emerald-700">${formatPoints(row.points)}</td>
                    <td class="px-3 py-3">${row.wins}-${row.draws}-${row.losses}</td>
                    <td class="px-3 py-3">${row.played}</td>
                    <td class="px-3 py-3 whitespace-nowrap">${colorBadges(row.colorHistory)}</td>
                    <td class="px-3 py-3 text-slate-600">${escapeHtml(row.completedOpponentIds.map(playerName).join(", ") || "-")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderHistory() {
      const matches = sortedMatches();
      document.querySelector("#view-history").innerHTML = `
        <div class="grid gap-4 lg:grid-cols-[1fr_380px]">
          <section class="surface rounded-2xl p-5">
            <h2 class="text-xl font-black">Historial</h2>
            <div class="mt-4 space-y-3">
              ${matches.length ? matches.map(historyCard).join("") : emptyState("Todavía no hay partidas.")}
            </div>
          </section>
          <aside class="surface rounded-2xl p-5 ${adminUnlocked ? "" : "hidden"}">
            <h2 class="text-xl font-black">Carga manual</h2>
            ${manualMatchForm()}
          </aside>
        </div>
      `;

      matches.forEach(match => {
        const card = document.querySelector(`[data-history-card="${match.id}"]`);
        card?.querySelector("[data-history-result]")?.addEventListener("change", event => setMatchResult(match.id, event.target.value));
        card?.querySelector("[data-delete-history]")?.addEventListener("click", () => deleteMatch(match.id));
        card?.querySelector("[data-swap]")?.addEventListener("click", () => updateMatch(match.id, { whiteId: match.blackId, blackId: match.whiteId }));
        card?.querySelector("[data-round]")?.addEventListener("change", event => updateMatch(match.id, { round: positiveNumber(event.target.value, match.round) }));
        card?.querySelector("[data-batch]")?.addEventListener("change", event => updateMatch(match.id, { batch: positiveNumber(event.target.value, match.batch) }));
        card?.querySelector("[data-board]")?.addEventListener("change", event => updateMatch(match.id, { board: positiveNumber(event.target.value, match.board) }));
      });

      document.querySelector("#manualMatchForm")?.addEventListener("submit", event => {
        event.preventDefault();
        addManualMatch(event.currentTarget);
      });
    }

    function historyCard(match) {
      if (match.byeId) {
        return `
          <article class="rounded-2xl border border-amber-200 bg-amber-50 p-4" data-history-card="${match.id}">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
              <div>
                <p class="text-xs font-black uppercase tracking-[0.14em] text-amber-700">R${match.round} · Mesa libre</p>
                <p class="mt-1 text-base font-black">${escapeHtml(playerName(match.byeId))}</p>
                <p class="mt-1 text-sm font-bold text-amber-900">Bye de 1 punto</p>
              </div>
              <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-black text-amber-900">+1</span>
            </div>
          </article>
        `;
      }

      const adminFields = adminUnlocked ? `
        <div class="mt-4 grid gap-2 sm:grid-cols-3">
          <input data-round type="number" min="1" value="${match.round}" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
          <input data-batch type="number" min="1" value="${match.batch}" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
          <input data-board type="number" min="1" value="${match.board}" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
        </div>
        <div class="mt-3 flex flex-col gap-2 sm:flex-row">
          <select data-history-result class="min-h-10 flex-1 rounded-xl border border-slate-300 bg-white px-3 text-sm font-semibold">
            <option value="" ${!match.result ? "selected" : ""}>Pendiente</option>
            <option value="1-0" ${match.result === "1-0" ? "selected" : ""}>1-0</option>
            <option value="0-1" ${match.result === "0-1" ? "selected" : ""}>0-1</option>
            <option value="0.5-0.5" ${match.result === "0.5-0.5" ? "selected" : ""}>0.5-0.5</option>
          </select>
          <button data-swap class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-black">Cambiar colores</button>
          <button data-delete-history class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm font-black text-red-800">Eliminar</button>
        </div>
      ` : "";

      return `
        <article class="rounded-2xl border border-slate-200 bg-white p-4" data-history-card="${match.id}">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
            <div>
              <p class="text-xs font-black uppercase tracking-[0.14em] text-slate-500">R${match.round} · T${match.batch} · M${match.board}</p>
              <p class="mt-1 text-base font-black">${escapeHtml(playerName(match.whiteId))} <span class="text-slate-400">vs</span> ${escapeHtml(playerName(match.blackId))}</p>
              <p class="mt-1 text-sm font-bold text-slate-600">${escapeHtml(resultText(match))}</p>
            </div>
            <span class="rounded-full ${match.result ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-900"} px-3 py-1 text-xs font-black">${match.result || "Pendiente"}</span>
          </div>
          ${adminFields}
        </article>
      `;
    }

    function manualMatchForm() {
      return `
        <form id="manualMatchForm" class="mt-4 space-y-3">
          <div class="grid grid-cols-3 gap-2">
            <input name="round" type="number" min="1" value="${maxRound()}" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
            <input name="batch" type="number" min="1" value="1" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
            <input name="board" type="number" min="1" value="1" class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm">
          </div>
          <select name="whiteId" class="min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3 text-sm font-semibold">
            <option value="">Blancas...</option>
            ${playerOptions("")}
          </select>
          <select name="blackId" class="min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3 text-sm font-semibold">
            <option value="">Negras...</option>
            ${playerOptions("")}
          </select>
          <select name="result" class="min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3 text-sm font-semibold">
            <option value="">Pendiente</option>
            <option value="1-0">1-0</option>
            <option value="0-1">0-1</option>
            <option value="0.5-0.5">0.5-0.5</option>
          </select>
          <button class="w-full rounded-xl bg-emerald-700 px-4 py-3 text-sm font-black text-white">Guardar partida</button>
        </form>
      `;
    }

    function renderPlayers() {
      const stats = calculateStats();
      const players = [...state.players].sort((a, b) => a.seed - b.seed || a.name.localeCompare(b.name, "es"));
      document.querySelector("#view-players").innerHTML = `
        <div class="grid gap-4 lg:grid-cols-[1fr_360px]">
          <section class="surface rounded-2xl p-5">
            <h2 class="text-xl font-black">Jugadores</h2>
            <div class="mt-4 grid gap-3">
              ${players.map(player => playerRow(player, stats.get(player.id))).join("")}
            </div>
          </section>
          <aside class="surface rounded-2xl p-5 ${adminUnlocked ? "" : "hidden"}">
            <h2 class="text-xl font-black">Nuevo jugador</h2>
            <form id="addPlayerForm" class="mt-4 flex gap-2">
              <input name="name" class="min-h-11 min-w-0 flex-1 rounded-xl border border-slate-300 px-3 text-sm font-semibold" placeholder="Nombre completo">
              <button class="rounded-xl bg-slate-950 px-4 py-3 text-sm font-black text-white">Agregar</button>
            </form>
          </aside>
        </div>
      `;

      players.forEach(player => {
        const row = document.querySelector(`[data-player-row="${player.id}"]`);
        row?.querySelector("[data-player-name]")?.addEventListener("change", event => {
          const name = event.target.value.trim();
          if (!name) return render();
          updatePlayer(player.id, { name });
        });
        row?.querySelector("[data-player-seed]")?.addEventListener("change", event => {
          updatePlayer(player.id, { seed: positiveNumber(event.target.value, player.seed) });
        });
        row?.querySelector("[data-player-active]")?.addEventListener("change", event => {
          updatePlayer(player.id, { active: event.target.checked });
        });
      });

      document.querySelector("#addPlayerForm")?.addEventListener("submit", event => {
        event.preventDefault();
        addPlayer(event.currentTarget);
      });
    }

    function playerRow(player, stat) {
      const locked = !adminUnlocked;
      return `
        <article class="rounded-2xl border border-slate-200 bg-white p-4" data-player-row="${player.id}">
          <div class="grid gap-3 lg:grid-cols-[90px_1fr_auto_auto] lg:items-center">
            <input data-player-seed type="number" min="1" value="${player.seed}" ${locked ? "disabled" : ""} class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm font-black">
            <input data-player-name value="${escapeAttribute(player.name)}" ${locked ? "disabled" : ""} class="min-h-10 rounded-xl border border-slate-300 px-3 text-sm font-black">
            <label class="flex items-center gap-2 text-sm font-black text-slate-700">
              <input data-player-active type="checkbox" ${player.active ? "checked" : ""} ${locked ? "disabled" : ""} class="h-4 w-4">
              Activo
            </label>
            <div class="text-sm font-black text-emerald-700">${formatPoints(stat?.points || 0)} pts</div>
          </div>
          <div class="mt-3 flex flex-wrap gap-x-4 gap-y-2 text-xs font-bold text-slate-500">
            <span>${stat?.played || 0} partidas</span>
            <span>${stat?.wins || 0}G ${stat?.draws || 0}T ${stat?.losses || 0}P</span>
            <span>${colorBadges(stat?.colorHistory || [])}</span>
          </div>
        </article>
      `;
    }

    function renderDatabase() {
      document.querySelector("#view-database").innerHTML = `
        <section class="surface rounded-2xl p-5">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h2 class="text-xl font-black">Base de datos</h2>
              <p class="mt-1 text-sm font-semibold text-slate-600">${remoteConnected ? `API remota conectada: ${escapeHtml(remoteApiUrl)}` : (dbAvailable ? "IndexedDB local activo" : "Fallback localStorage activo")}</p>
            </div>
            <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-700">${state.matches.length} partidas · ${state.players.length} jugadores</span>
          </div>

          <div class="mt-5 grid gap-4 lg:grid-cols-2">
            <form id="settingsForm" class="rounded-2xl border border-slate-200 bg-white p-4 ${adminUnlocked ? "" : "hidden"}">
              <h3 class="font-black">Configuración</h3>
              <div class="mt-3 grid gap-3 sm:grid-cols-2">
                <label class="text-sm font-bold text-slate-700">
                  Nombre
                  <input name="tournamentName" value="${escapeAttribute(settings.tournamentName)}" class="mt-1 min-h-10 w-full rounded-xl border border-slate-300 px-3 text-sm">
                </label>
                <label class="text-sm font-bold text-slate-700">
                  Rondas
                  <input name="totalRounds" type="number" min="1" value="${settings.totalRounds}" class="mt-1 min-h-10 w-full rounded-xl border border-slate-300 px-3 text-sm">
                </label>
                <label class="text-sm font-bold text-slate-700">
                  Tableros por tanda
                  <input name="boardsPerBatch" type="number" min="1" max="10" value="${settings.boardsPerBatch}" class="mt-1 min-h-10 w-full rounded-xl border border-slate-300 px-3 text-sm">
                </label>
                <label class="mt-7 flex items-center gap-2 text-sm font-black text-slate-700">
                  <input name="autoPairing" type="checkbox" ${settings.autoPairing ? "checked" : ""} class="h-4 w-4">
                  Auto emparejar
                </label>
              </div>
              <button class="mt-4 rounded-xl bg-slate-950 px-4 py-3 text-sm font-black text-white">Guardar configuración</button>
            </form>

            <div class="rounded-2xl border border-slate-200 bg-white p-4 ${adminUnlocked ? "" : "hidden"}">
              <h3 class="font-black">Backup</h3>
              <div class="mt-4 flex flex-col gap-2 sm:flex-row">
                <button id="exportBackup" class="rounded-xl bg-emerald-700 px-4 py-3 text-sm font-black text-white">Exportar JSON</button>
                <label class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-center text-sm font-black text-slate-800">
                  Importar JSON
                  <input id="importBackup" type="file" accept="application/json" class="hidden">
                </label>
              </div>
            </div>
          </div>
        </section>
      `;

      document.querySelector("#settingsForm")?.addEventListener("submit", async event => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        settings.tournamentName = String(data.get("tournamentName") || settings.tournamentName).trim();
        settings.totalRounds = positiveNumber(data.get("totalRounds"), settings.totalRounds);
        settings.boardsPerBatch = positiveNumber(data.get("boardsPerBatch"), settings.boardsPerBatch);
        settings.autoPairing = data.get("autoPairing") === "on";
        await saveSettings();
        await maybeAutoGeneratePairings();
        render();
        showToast("Configuración guardada.");
      });

      document.querySelector("#exportBackup")?.addEventListener("click", exportBackup);
      document.querySelector("#importBackup")?.addEventListener("change", importBackup);
    }

    function exportBackup() {
      const payload = JSON.stringify({ state, settings, exportedAt: new Date().toISOString() }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "uptp-chess-club-backup.json";
      anchor.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file || !adminUnlocked) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const payload = JSON.parse(reader.result);
          if (!payload.state || !payload.settings) throw new Error("Invalid backup");
          state = normalizeState(payload.state);
          settings = { ...DEFAULT_SETTINGS, ...payload.settings };
          await saveState();
          await saveSettings();
          render();
          showToast("Backup importado.");
        } catch {
          showToast("No se pudo importar el archivo.");
        }
      };
      reader.readAsText(file);
    }

    function playerOptions(selectedId) {
      return state.players.map(player => `
        <option value="${player.id}" ${player.id === selectedId ? "selected" : ""}>${escapeHtml(player.name)}</option>
      `).join("");
    }

    function emptyState(message) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-5 text-sm font-bold text-slate-500">${escapeHtml(message)}</div>`;
    }

    function positiveNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? number : fallback;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function showToast(message) {
      const alerts = document.querySelector("#alerts");
      const toast = document.createElement("div");
      toast.className = "surface rounded-xl px-4 py-3 text-sm font-black text-slate-800";
      toast.textContent = message;
      alerts.prepend(toast);
      setTimeout(() => toast.remove(), 4200);
    }

    function renderTabs() {
      document.querySelectorAll(".tab-btn").forEach(button => {
        const active = button.dataset.view === currentView;
        button.classList.toggle("tab-active", active);
        button.classList.toggle("tab-inactive", !active);
      });
      document.querySelectorAll(".view").forEach(section => {
        section.classList.toggle("hidden", section.id !== `view-${currentView}`);
      });
      document.querySelectorAll(".admin-nav").forEach(button => {
        button.classList.toggle("hidden", !adminUnlocked);
      });
    }

    function render() {
      if (!adminUnlocked && currentView === "database") currentView = "dashboard";
      renderSummary();
      renderDashboard();
      renderPairings();
      renderMap();
      renderStandings();
      renderHistory();
      renderPlayers();
      renderDatabase();
      renderTabs();
      requestAnimationFrame(drawResultsCanvas);
    }

    function openAdminModal() {
      const modal = document.querySelector("#adminModal");
      const hint = document.querySelector("#adminModalHint");
      const submit = document.querySelector("#adminSubmit");
      const lockButton = document.querySelector("#adminLockButton");

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.querySelector("#adminKeyInput").value = "";
      document.querySelector("#apiUrlInput").value = remoteApiUrl;

      if (remoteConnected) {
        hint.textContent = adminUnlocked
          ? "La sesión administrativa está activa."
          : "Ingresá la contraseña para cargar resultados y editar el torneo.";
        submit.textContent = adminUnlocked ? "Revalidar contraseña" : "Entrar";
        lockButton.classList.toggle("hidden", !adminUnlocked);
      } else if (remoteApiUrl) {
        hint.textContent = "La web usará la base del Droplet. Ingresá la contraseña de administrador.";
        submit.textContent = "Entrar";
        lockButton.classList.add("hidden");
      } else if (adminUnlocked) {
        hint.textContent = "La sesión administrativa local está activa en este navegador.";
        submit.textContent = "Actualizar clave local";
        lockButton.classList.remove("hidden");
      } else if (settings.adminHash) {
        hint.textContent = "Ingresá la clave local para habilitar resultados y edición.";
        submit.textContent = "Validar";
        lockButton.classList.add("hidden");
      } else {
        hint.textContent = "Primera configuración: esta clave queda guardada como hash local.";
        submit.textContent = "Crear clave";
        lockButton.classList.add("hidden");
      }
    }

    function closeAdminModal() {
      const modal = document.querySelector("#adminModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    async function handleAdminForm(event) {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const requestedApiUrl = normalizeApiUrl(formData.get("apiUrl")) || remoteApiUrl || await loadPublicApiUrl();
      const key = String(formData.get("key") || "").trim();
      if (key.length < 4) return showToast("La clave debe tener al menos 4 caracteres.");

      if (requestedApiUrl) {
        remoteApiUrl = requestedApiUrl;
        localStorage.setItem(REMOTE_API_STORAGE_KEY, remoteApiUrl);

        try {
          await loadRemoteData();
          const login = await apiRequest("/api/login", {
            method: "POST",
            body: JSON.stringify({ key })
          });
          remoteToken = login.token;
          adminUnlocked = true;
          sessionStorage.setItem("uptpRemoteToken", remoteToken);
          sessionStorage.setItem("uptpAdminUnlocked", "true");
          closeAdminModal();
          render();
          showToast("API remota conectada y administrador activo.");
        } catch {
          remoteConnected = false;
          remoteToken = "";
          sessionStorage.removeItem("uptpRemoteToken");
          showToast("No se pudo conectar o la clave del servidor es inválida.");
        }
        return;
      }

      if (remoteApiUrl && !requestedApiUrl) {
        remoteApiUrl = "";
        remoteConnected = false;
        remoteToken = "";
        localStorage.removeItem(REMOTE_API_STORAGE_KEY);
        sessionStorage.removeItem("uptpRemoteToken");
      }

      const hash = await hashText(key);

      if (!settings.adminHash || adminUnlocked) {
        settings.adminHash = hash;
        await saveSettings();
        adminUnlocked = true;
        sessionStorage.setItem("uptpAdminUnlocked", "true");
        closeAdminModal();
        render();
        showToast("Administrador activo.");
        return;
      }

      if (hash === settings.adminHash) {
        adminUnlocked = true;
        sessionStorage.setItem("uptpAdminUnlocked", "true");
        closeAdminModal();
        render();
        showToast("Administrador activo.");
      } else {
        showToast("Clave inválida.");
      }
    }

    function lockAdmin() {
      adminUnlocked = false;
      remoteToken = "";
      sessionStorage.removeItem("uptpRemoteToken");
      sessionStorage.removeItem("uptpAdminUnlocked");
      closeAdminModal();
      render();
      syncRemoteData();
      showToast("Administrador bloqueado.");
    }

    document.querySelectorAll(".tab-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentView = button.dataset.view;
        render();
      });
    });

    document.querySelector("#adminButton").addEventListener("click", openAdminModal);
    document.querySelector("#closeAdminModal").addEventListener("click", closeAdminModal);
    document.querySelector("#adminForm").addEventListener("submit", handleAdminForm);
    document.querySelector("#adminLockButton").addEventListener("click", lockAdmin);
    document.querySelector("#printButton").addEventListener("click", () => window.print());
    window.addEventListener("resize", () => {
      if (currentView === "map") drawResultsCanvas();
    });

    async function init() {
      await loadData();
      await maybeAutoGeneratePairings();
      render();
      startAutoSync();
    }

    init();
  </script>
</body>
</html>
