<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPTP Chess Club · Tournament Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --navy: #10384f;
      --ember: #d64032;
      --gold: #c9a24a;
      --felt: #2f7d62;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(214, 64, 50, 0.12), transparent 28rem),
        radial-gradient(circle at 94% 12%, rgba(47, 125, 98, 0.14), transparent 30rem),
        linear-gradient(180deg, #f7f3ea 0%, #f4f6f8 44%, #eef2f3 100%);
      color: var(--ink);
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
      backdrop-filter: blur(18px);
    }

    .surface {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(23, 32, 51, 0.09);
      box-shadow: 0 12px 35px rgba(23, 32, 51, 0.07);
    }

    .tab-active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .tab-inactive {
      background: rgba(255, 255, 255, 0.78);
      color: #445066;
      border-color: rgba(23, 32, 51, 0.12);
    }

    .board-pattern {
      background-image:
        linear-gradient(45deg, rgba(16, 56, 79, 0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(16, 56, 79, 0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(16, 56, 79, 0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(16, 56, 79, 0.08) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    .scroll-shadow {
      background:
        linear-gradient(90deg, #fff 30%, rgba(255, 255, 255, 0)),
        linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 70%) 100% 0,
        linear-gradient(90deg, rgba(23, 32, 51, 0.10), rgba(23, 32, 51, 0)),
        linear-gradient(90deg, rgba(23, 32, 51, 0), rgba(23, 32, 51, 0.10)) 100% 0;
      background-attachment: local, local, scroll, scroll;
      background-repeat: no-repeat;
      background-size: 24px 100%, 24px 100%, 12px 100%, 12px 100%;
    }

    .admin-only[disabled],
    .admin-only[aria-disabled="true"] {
      opacity: 0.52;
      pointer-events: none;
    }

    @media (max-width: 560px) {
      .mobile-pad {
        padding-left: 0.85rem;
        padding-right: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <header class="mx-auto max-w-7xl px-4 pb-4 pt-4 mobile-pad sm:pt-6">
      <div class="glass overflow-hidden rounded-2xl">
        <div class="grid gap-0 lg:grid-cols-[1fr_360px]">
          <section class="relative overflow-hidden p-5 sm:p-7">
            <div class="absolute inset-y-0 right-0 hidden w-80 board-pattern opacity-60 lg:block"></div>
            <div class="relative z-10 flex flex-col gap-5">
              <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex min-w-0 items-center gap-4">
                  <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-white shadow-sm">
                    <img class="h-12 w-12 rounded-xl object-contain" src="images.jpeg" alt="Logo UPTP">
                  </div>
                  <div class="min-w-0">
                    <p class="text-xs font-bold uppercase tracking-[0.18em] text-red-700">UPTP Chess Club</p>
                    <h1 class="mt-1 text-2xl font-black tracking-normal text-slate-950 sm:text-4xl">Swiss Manager</h1>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button id="adminButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 shadow-sm">Entrar admin</button>
                  <button id="printButton" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 shadow-sm">Imprimir</button>
                </div>
              </div>

              <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4" id="summary"></div>
            </div>
          </section>

          <aside class="border-t border-white/70 bg-slate-950 p-5 text-white lg:border-l lg:border-t-0">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-xs font-bold uppercase tracking-[0.18em] text-amber-300">Ronda activa</p>
                <p id="heroRound" class="mt-1 text-4xl font-black">-</p>
              </div>
              <div id="adminBadge" class="rounded-full bg-white/10 px-3 py-1 text-xs font-bold text-white">Bloqueado</div>
            </div>
            <div class="mt-5 overflow-hidden rounded-2xl border border-white/10 bg-white p-3">
              <img class="h-24 w-full object-contain" src="uptp.jpg" alt="Universidad Politécnica Taiwan Paraguay">
            </div>
            <div class="mt-5 rounded-2xl border border-white/10 bg-white/10 p-4">
              <p class="text-sm font-semibold text-slate-200">Siguiente tanda</p>
              <div id="nextBatchPreview" class="mt-3 space-y-2"></div>
            </div>
          </aside>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 pb-10 mobile-pad">
      <nav class="flex flex-wrap gap-2" aria-label="Vistas">
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="dashboard">Panel</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="pairings">Partidas</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="standings">Posiciones</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="history">Historial</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold" data-view="players">Jugadores</button>
        <button class="tab-btn rounded-xl border px-4 py-2 text-sm font-bold admin-nav" data-view="database">Base local</button>
      </nav>

      <section id="alerts" class="mt-4 space-y-2"></section>

      <section id="view-dashboard" class="view mt-4"></section>
      <section id="view-pairings" class="view mt-4 hidden"></section>
      <section id="view-standings" class="view mt-4 hidden"></section>
      <section id="view-history" class="view mt-4 hidden"></section>
      <section id="view-players" class="view mt-4 hidden"></section>
      <section id="view-database" class="view mt-4 hidden"></section>
    </main>
  </div>

  <div id="adminModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4">
    <div class="surface w-full max-w-md rounded-2xl p-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="text-xl font-black">Administrador</h2>
          <p id="adminModalHint" class="mt-1 text-sm text-slate-600"></p>
        </div>
        <button id="closeAdminModal" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-bold">Cerrar</button>
      </div>
      <form id="adminForm" class="mt-5 space-y-3">
        <input id="apiUrlInput" name="apiUrl" type="hidden">
        <label class="block text-sm">
          <span class="mb-1 block font-bold text-slate-700">Contraseña de administrador</span>
          <input id="adminKeyInput" name="key" type="password" autocomplete="current-password" placeholder="Escribí la contraseña" class="min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3">
        </label>
        <button id="adminSubmit" class="w-full rounded-xl bg-slate-950 px-4 py-3 text-sm font-black text-white">Entrar</button>
      </form>
      <button id="adminLockButton" class="mt-3 hidden w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-black text-slate-800">Bloquear administrador</button>
    </div>
  </div>

        source: "bye"
      }
    ];

    const DEFAULT_SETTINGS = {
      tournamentName: "Recreos UPTP 5+0",
      totalRounds: 5,
      boardsPerBatch: 3,
      autoPairing: true,
      adminHash: "",
      logoSource: LOGO_SOURCE
    };

    let database = null;
    let dbAvailable = false;
    let state = createInitialState();
    let settings = { ...DEFAULT_SETTINGS };
    let currentView = "dashboard";
    let remoteApiUrl = "";
    let remoteConnected = false;
    let remoteToken = sessionStorage.getItem("uptpRemoteToken") || "";
    let adminUnlocked = Boolean(remoteToken) || sessionStorage.getItem("uptpAdminUnlocked") === "true";

    function createInitialState() {
      return {
        version: 2,
        players: OFFICIAL_PLAYERS.map((name, index) => ({
          id: `p${index + 1}`,
          name,
          seed: index + 1,
          active: true
        })),
        matches: clone(INITIAL_MATCHES),
        appliedPatches: [OFFICIAL_DATA_PATCH_ID],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function normalizeApiUrl(value) {
      return String(value || "").trim().replace(/\/+$/, "");
    }

    async function apiRequest(path, options = {}) {
      if (!remoteApiUrl) throw new Error("remote_api_missing");

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (remoteToken) headers.Authorization = `Bearer ${remoteToken}`;

      const response = await fetch(`${remoteApiUrl}${path}`, {
        ...options,
        headers
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401) {
          remoteToken = "";
          adminUnlocked = false;
          sessionStorage.removeItem("uptpRemoteToken");
          sessionStorage.removeItem("uptpAdminUnlocked");
        }
        throw new Error(data.error || `api_${response.status}`);
      }

      return data;
    }

    async function loadRemoteData() {
      if (!remoteApiUrl) return false;

      try {
        const snapshot = await apiRequest("/api/state");
        state = normalizeState(snapshot.state || createInitialState());
        settings = { ...DEFAULT_SETTINGS, ...(snapshot.settings || {}) };
        remoteConnected = true;
        return true;
      } catch {
        remoteConnected = false;
        return false;
      }
    }

    async function saveRemoteSnapshot() {
      if (!remoteConnected || !adminUnlocked) return false;

      const snapshot = await apiRequest("/api/state", {
        method: "PUT",
        body: JSON.stringify({
          state,
          settings: publicSettings()
        })
      });

      state = normalizeState(snapshot.state || state);
      settings = { ...DEFAULT_SETTINGS, ...(snapshot.settings || settings) };
      return true;
    }

    function publicSettings() {
      const { adminHash, ...safeSettings } = settings;
      return safeSettings;
    }

    function openDatabase() {
      return new Promise(resolve => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "key" });
          }
        };
        request.onsuccess = event => resolve(event.target.result);
        request.onerror = () => resolve(null);
      });
    }

    function dbGet(key) {
      return new Promise(resolve => {
        if (!database) {
          const raw = localStorage.getItem(`fallback.${key}`);
          resolve(raw ? JSON.parse(raw) : null);
          return;
        }

        const tx = database.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(key);
        request.onsuccess = () => resolve(request.result ? request.result.value : null);
        request.onerror = () => resolve(null);
      });
    }

    function dbSet(key, value) {
      return new Promise(resolve => {
        if (!database) {
          localStorage.setItem(`fallback.${key}`, JSON.stringify(value));
          resolve();
          return;
        }

        const tx = database.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put({ key, value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function loadData() {
      database = await openDatabase();
      dbAvailable = Boolean(database);
      const publicApiUrl = await loadPublicApiUrl();
      const savedApiUrl = normalizeApiUrl(localStorage.getItem(REMOTE_API_STORAGE_KEY));
      remoteApiUrl = publicApiUrl || savedApiUrl;

      if (publicApiUrl && savedApiUrl !== publicApiUrl) {
        localStorage.setItem(REMOTE_API_STORAGE_KEY, publicApiUrl);
      }

      if (await loadRemoteData()) {
        if (!remoteToken) {
          adminUnlocked = false;
          sessionStorage.removeItem("uptpAdminUnlocked");
        }
        return;
      }
      if (remoteApiUrl && remoteToken) {
        remoteToken = "";
        adminUnlocked = sessionStorage.getItem("uptpAdminUnlocked") === "true";
        sessionStorage.removeItem("uptpRemoteToken");
      }

      const savedState = await dbGet("tournament");
      const savedSettings = await dbGet("settings");

      if (savedState) {
        state = normalizeState(savedState);
        if (applyOfficialDataPatches()) await saveState();
      } else {
        const legacy = readLegacyState();
        state = legacy ? normalizeState(legacy) : createInitialState();
        if (legacy && applyOfficialDataPatches()) await saveState();
        await saveState();
      }

      settings = { ...DEFAULT_SETTINGS, ...(savedSettings || {}) };
      await saveSettings();
    }

    async function loadPublicApiUrl() {
      try {
        const response = await fetch("api-config.json", { cache: "no-store" });
        if (!response.ok) return "";
        const config = await response.json();
        return normalizeApiUrl(config.apiUrl);
      } catch {
        return "";
      }
    }

    function readLegacyState() {
      try {
        const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function normalizeState(input) {
      const normalized = {
        ...createInitialState(),
        ...input,
        players: Array.isArray(input.players) ? input.players : [],
        matches: Array.isArray(input.matches) ? input.matches : [],
        appliedPatches: Array.isArray(input.appliedPatches) ? input.appliedPatches : []
      };

      normalized.players = normalized.players.map((player, index) => ({
        id: player.id || `p-${Date.now()}-${index}`,
        name: player.name || "Jugador sin nombre",
        seed: Number.isFinite(Number(player.seed)) ? Number(player.seed) : index + 1,
        active: player.active !== false
      }));

      normalized.matches = normalized.matches.map((match, index) => ({
        id: match.id || `m-${Date.now()}-${index}`,
        round: positiveNumber(match.round, 1),
        batch: positiveNumber(match.batch, 1),
        board: positiveNumber(match.board, 1),
        whiteId: match.whiteId,
        blackId: match.blackId,
        byeId: match.byeId,
        result: match.result || "",
        createdAt: match.createdAt || new Date().toISOString(),
        source: match.source || "manual"
      })).filter(match => (match.whiteId && match.blackId) || match.byeId);

      return normalized;
    }

    function applyOfficialDataPatches() {
      let changed = false;

      if (!state.appliedPatches.includes(OFFICIAL_DATA_PATCH_ID)) {
        ensureOfficialPlayer({ id: "p17", name: "Josue Hartman", seed: 17, active: true });
        const officialIds = new Set(INITIAL_MATCHES.map(match => match.id));
        state.matches = state.matches.filter(match =>
          officialIds.has(match.id) ||
          (match.source !== "auto" && match.source !== "advance" && match.source !== "admin")
        );
        state.matches = state.matches.filter(match =>
          match.id !== "m-oficial-6-oscar-diego" &&
          match.id !== "m-oficial-7-oscar-nicolas" &&
          match.id !== "m-oficial-8-camila-saul" &&
          match.id !== "m-oficial-9-jose-fabrizio"
        );
        for (const officialMatch of INITIAL_MATCHES) {
          upsertOfficialMatch(officialMatch);
        }
        state.appliedPatches.push(OFFICIAL_DATA_PATCH_ID);
        changed = true;
      }

      return changed;
    }

    function ensureOfficialPlayer(player) {
      const exists = state.players.some(item => item.id === player.id || item.name.toLowerCase() === player.name.toLowerCase());
      if (!exists) state.players.push(clone(player));
    }

    function upsertOfficialMatch(officialMatch) {
      const existing = state.matches.find(match =>
        match.id === officialMatch.id ||
        (officialMatch.byeId && match.byeId === officialMatch.byeId && match.round === officialMatch.round) ||
        ((match.whiteId === officialMatch.whiteId && match.blackId === officialMatch.blackId) ||
          (match.whiteId === officialMatch.blackId && match.blackId === officialMatch.whiteId))
      );

      if (existing) {
        Object.assign(existing, clone(officialMatch));
      } else {
        state.matches.push(clone(officialMatch));
      }
    }

    async function saveState() {
      state.updatedAt = new Date().toISOString();
      if (remoteConnected) {
        await saveRemoteSnapshot();
        return;
      }
      await dbSet("tournament", state);
    }

    async function saveSettings() {
      if (remoteConnected) {
        await saveRemoteSnapshot();
        return;
      }
      await dbSet("settings", settings);
    }

    async function hashText(text) {
      const value = String(text);
      if (window.crypto && window.crypto.subtle) {
        const data = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, "0")).join("");
      }

      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = ((hash << 5) - hash + value.charCodeAt(index)) | 0;
      }
      return `fallback-${hash}`;
    }

    function getPlayer(id) {
      return state.players.find(player => player.id === id);
    }

    function playerName(id) {
      return getPlayer(id)?.name || "Jugador eliminado";
    }

    function activePlayers() {
      return state.players.filter(player => player.active);
    }

    function sortedMatches(matches = state.matches) {
      return [...matches].sort((a, b) =>
        a.round - b.round ||
        a.batch - b.batch ||
        a.board - b.board ||
        String(a.createdAt).localeCompare(String(b.createdAt))
      );
    }

    function completedMatches() {
      return sortedMatches(state.matches.filter(match => match.result));
    }

    function pendingMatches() {
      return sortedMatches(state.matches.filter(match => !match.result));
    }

    function matchesForRound(round) {
      return sortedMatches(state.matches.filter(match => match.round === round));
    }

    function maxRound() {
      return state.matches.reduce((max, match) => Math.max(max, match.round || 1), 1);
    }

    function scoreFromResult(match, playerId) {
      if (match.result === "bye") return match.byeId === playerId ? 1 : 0;
      if (!match.result) return 0;
      if (match.result === "1-0") return match.whiteId === playerId ? 1 : 0;
      if (match.result === "0-1") return match.blackId === playerId ? 1 : 0;
      if (match.result === "0.5-0.5") return 0.5;
      return 0;
    }

    function calculateStats() {
      const stats = new Map();
      state.players.forEach(player => {
        stats.set(player.id, {
          player,
          points: 0,
          wins: 0,
          draws: 0,
          losses: 0,
          played: 0,
          scheduled: 0,
          whiteCount: 0,
          blackCount: 0,
          colorHistory: [],
          completedOpponentIds: [],
          allOpponentIds: new Set(),
          buchholz: 0
        });
      });

      for (const match of sortedMatches()) {
        if (match.byeId) {
          const bye = stats.get(match.byeId);
          if (!bye) continue;
          bye.scheduled += 1;
          if (match.result === "bye") {
            bye.points += 1;
            bye.wins += 1;
            bye.played += 1;
          }
          continue;
        }

        const white = stats.get(match.whiteId);
        const black = stats.get(match.blackId);
        if (!white || !black) continue;

        white.scheduled += 1;
        black.scheduled += 1;
        white.whiteCount += 1;
        black.blackCount += 1;
        white.colorHistory.push("B");
        black.colorHistory.push("N");
        white.allOpponentIds.add(match.blackId);
        black.allOpponentIds.add(match.whiteId);

        if (!match.result) continue;

        const whiteScore = scoreFromResult(match, match.whiteId);
        const blackScore = scoreFromResult(match, match.blackId);
        white.points += whiteScore;
        black.points += blackScore;
        white.played += 1;
        black.played += 1;
        white.completedOpponentIds.push(match.blackId);
        black.completedOpponentIds.push(match.whiteId);

        if (whiteScore === 1) {
          white.wins += 1;
          black.losses += 1;
        } else if (blackScore === 1) {
          black.wins += 1;
          white.losses += 1;
        } else {
          white.draws += 1;
          black.draws += 1;
        }
      }

      for (const item of stats.values()) {
        item.buchholz = item.completedOpponentIds.reduce((sum, opponentId) => {
          return sum + (stats.get(opponentId)?.points || 0);
        }, 0);
      }

      return stats;
    }

    function standings() {
      return [...calculateStats().values()].sort((a, b) =>
        b.points - a.points ||
        b.wins - a.wins ||
        b.buchholz - a.buchholz ||
        a.player.seed - b.player.seed ||
        a.player.name.localeCompare(b.player.name, "es")
      );
    }

    function hasPlayedOrScheduled(idA, idB) {
      return state.matches.some(match =>
        !match.byeId &&
        ((match.whiteId === idA && match.blackId === idB) ||
          (match.whiteId === idB && match.blackId === idA))
      );
    }

    function lastColors(stat, count) {
      return stat.colorHistory.slice(-count);
    }

    function colorPenalty(stat, color) {
      const whiteAfter = stat.whiteCount + (color === "B" ? 1 : 0);
      const blackAfter = stat.blackCount + (color === "N" ? 1 : 0);
      const balance = Math.abs(whiteAfter - blackAfter);
      const last = lastColors(stat, 1)[0];
      const lastTwo = lastColors(stat, 2);
      let streak = 0;

      if (last === color) streak += 6;
      if (lastTwo.length === 2 && lastTwo.every(item => item === color)) streak += 30;

      return balance + streak;
    }

    function orientedPair(idA, idB, stats) {
      const a = stats.get(idA);
      const b = stats.get(idB);
      const aWhite = colorPenalty(a, "B") + colorPenalty(b, "N");
      const bWhite = colorPenalty(a, "N") + colorPenalty(b, "B");

      if (aWhite < bWhite) return { whiteId: idA, blackId: idB, colorCost: aWhite };
      if (bWhite < aWhite) return { whiteId: idB, blackId: idA, colorCost: bWhite };

      return a.player.seed <= b.player.seed
        ? { whiteId: idA, blackId: idB, colorCost: aWhite }
        : { whiteId: idB, blackId: idA, colorCost: bWhite };
    }

    function pairingCost(idA, idB, stats, orderedIds) {
      const a = stats.get(idA);
      const b = stats.get(idB);
      const repeated = hasPlayedOrScheduled(idA, idB) ? 1_000_000_000 : 0;
      const scoreDistance = Math.abs(a.points - b.points) * 1_000_000;
      const indexDistance = Math.abs(orderedIds.indexOf(idA) - orderedIds.indexOf(idB));
      const standardSwissDistance = Math.abs(indexDistance - Math.floor(orderedIds.length / 2)) * 1_000;
      const color = orientedPair(idA, idB, stats).colorCost * 100;
      const seed = Math.abs(a.player.seed - b.player.seed);

      return repeated + scoreDistance + standardSwissDistance + color + seed;
    }

    function generateSwissPairs(playerIds) {
      const stats = calculateStats();
      const ordered = [...playerIds].sort((idA, idB) => {
        const a = stats.get(idA);
        const b = stats.get(idB);
        return b.points - a.points ||
          a.player.seed - b.player.seed ||
          a.player.name.localeCompare(b.player.name, "es");
      });
      const memo = new Map();

      function solve(remaining) {
        const key = remaining.join("|");
        if (memo.has(key)) return memo.get(key);
        if (remaining.length === 0) return { cost: 0, pairs: [] };

        const first = remaining[0];
        let best = { cost: Number.POSITIVE_INFINITY, pairs: [] };
        const candidates = remaining.slice(1).sort((idA, idB) =>
          pairingCost(first, idA, stats, ordered) - pairingCost(first, idB, stats, ordered)
        );

        for (const candidate of candidates) {
          const rest = remaining.filter(id => id !== first && id !== candidate);
          const solved = solve(rest);
          const cost = pairingCost(first, candidate, stats, ordered) + solved.cost;
          if (cost < best.cost) {
            best = {
              cost,
              pairs: [orientedPair(first, candidate, stats), ...solved.pairs]
            };
          }
        }

        memo.set(key, best);
        return best;
      }

      return solve(ordered).pairs;
    }

    function chooseByeId(playerIds) {
      const stats = calculateStats();
      const previousByes = new Set(state.matches.filter(match => match.byeId).map(match => match.byeId));
      const candidates = playerIds.filter(id => !previousByes.has(id));
      const pool = candidates.length ? candidates : playerIds;

      return [...pool].sort((idA, idB) => {
        const a = stats.get(idA);
        const b = stats.get(idB);
        return a.points - b.points ||
          a.played - b.played ||
          b.player.seed - a.player.seed ||
          a.player.name.localeCompare(b.player.name, "es");
      })[0];
    }

    function generationContext() {
      const activeIds = activePlayers().map(player => player.id);
      if (activeIds.length < 2) return null;

      const round = maxRound();
      const expected = Math.ceil(activeIds.length / 2);
      const roundMatches = matchesForRound(round);
      const isCurrentIncomplete = roundMatches.length > 0 && roundMatches.length < expected;

      if (isCurrentIncomplete) {
        const scheduledIds = new Set();
        roundMatches.forEach(match => {
          if (match.byeId) scheduledIds.add(match.byeId);
          scheduledIds.add(match.whiteId);
          scheduledIds.add(match.blackId);
        });

        return {
          mode: "complete",
          round,
          existingMatches: roundMatches.length,
          playerIds: activeIds.filter(id => !scheduledIds.has(id))
        };
      }

      if (roundMatches.length >= expected && round >= settings.totalRounds) return null;

      return {
        mode: "new",
        round: state.matches.length ? round + 1 : 1,
        existingMatches: 0,
        playerIds: activeIds
      };
    }

    function advanceGenerationContext() {
      const busyIds = new Set();
      pendingMatches().forEach(match => {
        if (match.byeId) busyIds.add(match.byeId);
        busyIds.add(match.whiteId);
        busyIds.add(match.blackId);
      });

      const round = maxRound() + 1;
      const alreadyAdvancedIds = new Set();
      matchesForRound(round).forEach(match => {
        if (match.byeId) alreadyAdvancedIds.add(match.byeId);
        alreadyAdvancedIds.add(match.whiteId);
        alreadyAdvancedIds.add(match.blackId);
      });

      const playerIds = activePlayers()
        .map(player => player.id)
        .filter(id => !busyIds.has(id) && !alreadyAdvancedIds.has(id));

      return {
        mode: "advance",
        round,
        existingMatches: matchesForRound(round).length,
        playerIds: playerIds.length % 2 === 0 ? playerIds : playerIds.slice(0, -1)
      };
    }

    async function generatePairings(options = {}) {
      if (!options.advance && pendingMatches().length > 0) {
        if (!options.silent) showToast("Primero cargá los resultados pendientes.");
        return false;
      }

      const context = options.advance ? advanceGenerationContext() : generationContext();
      if (!context) {
        if (!options.silent) showToast("No hay una ronda disponible para generar.");
        return false;
      }

      if (context.playerIds.length < 2) {
        if (!options.silent) showToast("No hay suficientes jugadores libres para adelantar partidas.");
        return false;
      }

      const playerIds = [...context.playerIds];
      let byeMatch = null;

      if (playerIds.length % 2 !== 0) {
        const byeId = chooseByeId(playerIds);
        const byeIndex = context.existingMatches + Math.floor(playerIds.length / 2);
        byeMatch = {
          id: `bye-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          round: context.round,
          batch: Math.floor(byeIndex / settings.boardsPerBatch) + 1,
          board: (byeIndex % settings.boardsPerBatch) + 1,
          byeId,
          result: "bye",
          createdAt: new Date().toISOString(),
          source: "bye"
        };
        playerIds.splice(playerIds.indexOf(byeId), 1);
      }

      const pairs = generateSwissPairs(playerIds);
      const createdAt = new Date().toISOString();
      const newMatches = pairs.map((pair, index) => {
        const matchIndex = context.existingMatches + index;
        return {
          id: `m-${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
          round: context.round,
          batch: Math.floor(matchIndex / settings.boardsPerBatch) + 1,
          board: (matchIndex % settings.boardsPerBatch) + 1,
          whiteId: pair.whiteId,
          blackId: pair.blackId,
          result: "",
          createdAt,
          source: options.advance ? "advance" : (options.auto ? "auto" : "admin")
        };
      });

      if (byeMatch) newMatches.push(byeMatch);

      state.matches.push(...newMatches);
      await saveState();
      currentView = "pairings";
      render();
      if (!options.silent) {
        if (context.mode === "advance") {
          showToast(`Se generó un adelanto de ronda ${context.round}: ${newMatches.length} partidas con jugadores libres.`);
        } else {
          const verb = context.mode === "complete" ? "completó" : "generó";
          showToast(`Se ${verb} la ronda ${context.round}: ${newMatches.length} partidas.`);
        }
      }
      return true;
    }

    async function maybeAutoGeneratePairings() {
      if (!settings.autoPairing) return;
      if (pendingMatches().length > 0) return;
      const context = generationContext();
      if (!context || context.playerIds.length === 0) return;
      await generatePairings({ auto: true, silent: true });
    }

    async function setMatchResult(matchId, result) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      match.result = result;
      await saveState();
      await maybeAutoGeneratePairings();
      render();
      showToast("Resultado guardado.");
    }

    async function updateMatch(matchId, updates) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      Object.assign(match, updates);
      await saveState();
      render();
    }

    async function deleteMatch(matchId) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const match = state.matches.find(item => item.id === matchId);
      if (!match) return;
      const confirmed = confirm(`¿Eliminar ${playerName(match.whiteId)} vs ${playerName(match.blackId)}?`);
      if (!confirmed) return;
      state.matches = state.matches.filter(item => item.id !== matchId);
      await saveState();
      render();
      showToast("Partida eliminada.");
    }

    async function updatePlayer(playerId, updates) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const player = getPlayer(playerId);
      if (!player) return;
      Object.assign(player, updates);
      await saveState();
      render();
    }

    async function addPlayer(form) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const formData = new FormData(form);
      const name = String(formData.get("name") || "").trim();
      if (!name) return showToast("Ingresá un nombre.");
      const nextSeed = Math.max(0, ...state.players.map(player => Number(player.seed) || 0)) + 1;
      state.players.push({
        id: `p-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        name,
        seed: nextSeed,
        active: true
      });
      await saveState();
      form.reset();
      render();
      showToast("Jugador agregado.");
    }

    async function addManualMatch(form) {
      if (!adminUnlocked) return showToast("Modo administrador requerido.");
      const formData = new FormData(form);
      const whiteId = formData.get("whiteId");
      const blackId = formData.get("blackId");
      if (!whiteId || !blackId || whiteId === blackId) return showToast("Elegí dos jugadores distintos.");

      state.matches.push({
        id: `m-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        round: positiveNumber(formData.get("round"), maxRound()),
        batch: positiveNumber(formData.get("batch"), 1),
        board: positiveNumber(formData.get("board"), 1),
        whiteId,
        blackId,
        result: formData.get("result") || "",
        createdAt: new Date().toISOString(),
        source: "manual"
      });
      await saveState();
      form.reset();
      render();
      showToast("Partida cargada.");
    }

    function groupedByBatch(matches) {
      const groups = new Map();
      matches.forEach(match => {
        const key = `Ronda ${match.round} · Tanda ${match.batch}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(match);
      });
      return [...groups.entries()];
    }

      if (match.result === "1-0") return `Ganó ${playerName(match.whiteId)}`;
      if (match.result === "0-1") return `Ganó ${playerName(match.blackId)}`;
      if (match.result === "0.5-0.5") return "Tablas";
      return "Pendiente";

    }

    function exportBackup() {
      const payload = JSON.stringify({ state, settings, exportedAt: new Date().toISOString() }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "uptp-chess-club-backup.json";
      anchor.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file || !adminUnlocked) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const payload = JSON.parse(reader.result);
          if (!payload.state || !payload.settings) throw new Error("Invalid backup");
          state = normalizeState(payload.state);
          settings = { ...DEFAULT_SETTINGS, ...payload.settings };
          await saveState();
          await saveSettings();
          render();
          showToast("Backup importado.");
        } catch {
          showToast("No se pudo importar el archivo.");
        }
      };
      reader.readAsText(file);
    }

      return state.players.map(player => `
        <option value="${player.id}" ${player.id === selectedId ? "selected" : ""}>${escapeHtml(player.name)}</option>
      `).join("");
    }

    function emptyState(message) {
      return `<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-5 text-sm font-bold text-slate-500">${escapeHtml(message)}</div>`;
    }

    function positiveNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? number : fallback;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function showToast(message) {
      const alerts = document.querySelector("#alerts");
      const toast = document.createElement("div");
      toast.className = "surface rounded-xl px-4 py-3 text-sm font-black text-slate-800";
      toast.textContent = message;
      alerts.prepend(toast);
      setTimeout(() => toast.remove(), 4200);
    }

    function renderTabs() {
      document.querySelectorAll(".tab-btn").forEach(button => {
        const active = button.dataset.view === currentView;
        button.classList.toggle("tab-active", active);
        button.classList.toggle("tab-inactive", !active);
      });
      document.querySelectorAll(".view").forEach(section => {
        section.classList.toggle("hidden", section.id !== `view-${currentView}`);
      });
      document.querySelectorAll(".admin-nav").forEach(button => {
        button.classList.toggle("hidden", !adminUnlocked);
      });
    }

    function render() {
      if (!adminUnlocked && currentView === "database") currentView = "dashboard";
      renderSummary();
      renderDashboard();
      renderPairings();
      renderStandings();
      renderHistory();
      renderPlayers();
      renderDatabase();
      renderTabs();
    }

    function openAdminModal() {
      const modal = document.querySelector("#adminModal");
      const hint = document.querySelector("#adminModalHint");
      const submit = document.querySelector("#adminSubmit");
      const lockButton = document.querySelector("#adminLockButton");

      modal.classList.remove("hidden");
      modal.classList.add("flex");
      document.querySelector("#adminKeyInput").value = "";
      document.querySelector("#apiUrlInput").value = remoteApiUrl;

      if (remoteConnected) {
        hint.textContent = adminUnlocked
          ? "La sesión administrativa está activa."
          : "Ingresá la contraseña para cargar resultados y editar el torneo.";
        submit.textContent = adminUnlocked ? "Revalidar contraseña" : "Entrar";
        lockButton.classList.toggle("hidden", !adminUnlocked);
      } else if (remoteApiUrl) {
        hint.textContent = "La web usará la base del Droplet. Ingresá la contraseña de administrador.";
        submit.textContent = "Entrar";
        lockButton.classList.add("hidden");
      } else if (adminUnlocked) {
        hint.textContent = "La sesión administrativa local está activa en este navegador.";
        submit.textContent = "Actualizar clave local";
        lockButton.classList.remove("hidden");
      } else if (settings.adminHash) {
        hint.textContent = "Ingresá la clave local para habilitar resultados y edición.";
        submit.textContent = "Validar";
        lockButton.classList.add("hidden");
      } else {
        hint.textContent = "Primera configuración: esta clave queda guardada como hash local.";
        submit.textContent = "Crear clave";
        lockButton.classList.add("hidden");
      }
    }

    function closeAdminModal() {
      const modal = document.querySelector("#adminModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    async function handleAdminForm(event) {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const requestedApiUrl = normalizeApiUrl(formData.get("apiUrl")) || remoteApiUrl || await loadPublicApiUrl();
      const key = String(formData.get("key") || "").trim();
      if (key.length < 4) return showToast("La clave debe tener al menos 4 caracteres.");

      if (requestedApiUrl) {
        remoteApiUrl = requestedApiUrl;
        localStorage.setItem(REMOTE_API_STORAGE_KEY, remoteApiUrl);

        try {
          await loadRemoteData();
          const login = await apiRequest("/api/login", {
            method: "POST",
            body: JSON.stringify({ key })
          });
          remoteToken = login.token;
          adminUnlocked = true;
          sessionStorage.setItem("uptpRemoteToken", remoteToken);
          sessionStorage.setItem("uptpAdminUnlocked", "true");
          closeAdminModal();
          render();
          showToast("API remota conectada y administrador activo.");
        } catch {
          remoteConnected = false;
          remoteToken = "";
          sessionStorage.removeItem("uptpRemoteToken");
          showToast("No se pudo conectar o la clave del servidor es inválida.");
        }
        return;
      }

      if (remoteApiUrl && !requestedApiUrl) {
        remoteApiUrl = "";
        remoteConnected = false;
        remoteToken = "";
        localStorage.removeItem(REMOTE_API_STORAGE_KEY);
        sessionStorage.removeItem("uptpRemoteToken");
      }

      const hash = await hashText(key);

      if (!settings.adminHash || adminUnlocked) {
        settings.adminHash = hash;
        await saveSettings();
        adminUnlocked = true;
        sessionStorage.setItem("uptpAdminUnlocked", "true");
        closeAdminModal();
        render();
        showToast("Administrador activo.");
        return;
      }

      if (hash === settings.adminHash) {
        adminUnlocked = true;
        sessionStorage.setItem("uptpAdminUnlocked", "true");
        closeAdminModal();
        render();
        showToast("Administrador activo.");
      } else {
        showToast("Clave inválida.");
      }
    }

    function lockAdmin() {
      adminUnlocked = false;
      remoteToken = "";
      sessionStorage.removeItem("uptpRemoteToken");
      sessionStorage.removeItem("uptpAdminUnlocked");
      closeAdminModal();
      render();
      showToast("Administrador bloqueado.");
    }

    document.querySelectorAll(".tab-btn").forEach(button => {
      button.addEventListener("click", () => {
        currentView = button.dataset.view;
        render();
      });
    });

    document.querySelector("#adminButton").addEventListener("click", openAdminModal);
    document.querySelector("#closeAdminModal").addEventListener("click", closeAdminModal);
    document.querySelector("#adminForm").addEventListener("submit", handleAdminForm);
    document.querySelector("#adminLockButton").addEventListener("click", lockAdmin);
    document.querySelector("#printButton").addEventListener("click", () => window.print());

    async function init() {
      await loadData();
      await maybeAutoGeneratePairings();
      render();
    }

    init();
  </script>
</body>
</html>
